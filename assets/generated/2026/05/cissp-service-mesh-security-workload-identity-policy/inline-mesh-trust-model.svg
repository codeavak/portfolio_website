<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Service Mesh Trust Model</title>
  <desc id="desc">Diagram showing workload identities, sidecar proxies, mesh control plane, and authorization policy checks for east-west service communication.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="780" fill="url(#bg2)"/>
  <text x="60" y="72" fill="#f9fafb" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Mesh Trust Model</text>
  <text x="60" y="110" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Encryption is one layer. Identity issuance, authorization, and control-plane trust complete the model</text>

  <rect x="80" y="170" width="300" height="150" rx="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <text x="105" y="225" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Workloads</text>
  <text x="105" y="266" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="21">Named services and owners</text>

  <rect x="430" y="170" width="300" height="150" rx="14" fill="#065f46" stroke="#6ee7b7" stroke-width="2"/>
  <text x="455" y="225" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Sidecars or Proxies</text>
  <text x="455" y="266" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="21">mTLS and request policy</text>

  <rect x="780" y="170" width="300" height="150" rx="14" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
  <text x="805" y="225" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Control Plane</text>
  <text x="805" y="266" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="21">Identity, config, and policy</text>

  <rect x="1130" y="170" width="210" height="150" rx="14" fill="#5b21b6" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1155" y="225" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Telemetry</text>
  <text x="1155" y="266" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="21">Denied and allowed flows</text>

  <rect x="80" y="390" width="1260" height="310" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="110" y="445" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">High-Value Questions</text>
  <text x="120" y="500" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">1. Who can issue workload identity and how quickly can bad identity be revoked?</text>
  <text x="120" y="548" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">2. Which service paths are explicitly allowed and which are denied by default?</text>
  <text x="120" y="596" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">3. How are policy changes reviewed, tested, and rolled back?</text>
  <text x="120" y="644" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">4. Which telemetry proves east-west trust is working as intended?</text>
</svg>
