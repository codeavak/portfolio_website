<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">DNSSEC Chain of Trust in Practice</title>
  <desc id="desc">Flow diagram showing root to TLD to domain trust chain and resolver validation outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <style>
      .h { font: 700 34px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .s { font: 600 20px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
      .b { font: 500 18px 'Segoe UI', Tahoma, sans-serif; fill: #1e293b; }
      .k { font: 700 18px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .a { stroke: #0ea5e9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="60" y="70" class="h">DNSSEC Chain of Trust: Resolver Decision Path</text>

  <rect x="90" y="120" width="220" height="110" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="115" y="165" class="s">Root Trust Anchor</text>
  <text x="115" y="200" class="b">Known starting key</text>

  <rect x="360" y="120" width="220" height="110" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="385" y="165" class="s">TLD DS + DNSKEY</text>
  <text x="385" y="200" class="b">Delegation verified</text>

  <rect x="630" y="120" width="220" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="165" class="s">Domain DS + DNSKEY</text>
  <text x="655" y="200" class="b">Zone key continuity</text>

  <rect x="900" y="120" width="220" height="110" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="925" y="165" class="s">Signed RRsets</text>
  <text x="925" y="200" class="b">Answer integrity check</text>

  <path d="M 310 175 L 360 175" class="a"/>
  <path d="M 580 175 L 630 175" class="a"/>
  <path d="M 850 175 L 900 175" class="a"/>

  <rect x="120" y="300" width="430" height="240" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="150" y="345" class="s">Validation Success</text>
  <text x="150" y="385" class="b">- Resolver returns authenticated data</text>
  <text x="150" y="420" class="b">- Users and systems reach intended services</text>
  <text x="150" y="455" class="b">- Spoofed answer risk is reduced</text>
  <text x="150" y="505" class="k">Outcome: higher integrity resolution</text>

  <rect x="650" y="300" width="430" height="240" rx="16" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="345" class="s">Validation Failure</text>
  <text x="680" y="385" class="b">- Broken chain, bad signature, or stale key state</text>
  <text x="680" y="420" class="b">- Resolver blocks or marks response as bogus</text>
  <text x="680" y="455" class="b">- Incident response and rollback workflows start</text>
  <text x="680" y="505" class="k">Outcome: availability impact but integrity preserved</text>

  <path d="M 980 230 L 350 300" class="a"/>
  <path d="M 1000 230 L 870 300" class="a"/>

  <text x="270" y="605" class="b">CISSP lens: DNSSEC improves answer authenticity, but operational readiness determines resilience during key or delegation failures.</text>
</svg>
