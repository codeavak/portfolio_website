<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Software supply chain security diagram showing source, dependencies, build, sign, and deploy with assurance controls">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)" rx="14"/>
  <text x="480" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#f8fafc">Software Supply Chain Security</text>
  <text x="480" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#93c5fd">CISSP Domain 8 - Composition visibility, build integrity, and response discipline</text>

  <rect x="36" y="100" width="170" height="110" rx="10" fill="#10213f" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="121" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#93c5fd">Source + Dependencies</text>
  <text x="121" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">First-party code</text>
  <text x="121" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">Open source packages</text>
  <text x="121" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">Transitive libraries</text>

  <line x1="206" y1="155" x2="258" y2="155" stroke="#475569" stroke-width="3"/>
  <polygon points="258,155 246,149 246,161" fill="#475569"/>

  <rect x="258" y="100" width="170" height="110" rx="10" fill="#1b2330" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="343" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#fbbf24">Build Pipeline</text>
  <text x="343" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fde68a">CI/CD workflow</text>
  <text x="343" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fde68a">Secrets + runners</text>
  <text x="343" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fde68a">Policy gates</text>

  <line x1="428" y1="155" x2="480" y2="155" stroke="#475569" stroke-width="3"/>
  <polygon points="480,155 468,149 468,161" fill="#475569"/>

  <rect x="480" y="100" width="170" height="110" rx="10" fill="#08261c" stroke="#34d399" stroke-width="1.6"/>
  <text x="565" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#6ee7b7">Artifact + Signing</text>
  <text x="565" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5">Checksums</text>
  <text x="565" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5">Signatures</text>
  <text x="565" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5">Approved promotion</text>

  <line x1="650" y1="155" x2="702" y2="155" stroke="#475569" stroke-width="3"/>
  <polygon points="702,155 690,149 690,161" fill="#475569"/>

  <rect x="702" y="100" width="222" height="110" rx="10" fill="#26122a" stroke="#c084fc" stroke-width="1.6"/>
  <text x="813" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#d8b4fe">Deploy + Respond</text>
  <text x="813" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f3e8ff">Runtime inventory</text>
  <text x="813" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f3e8ff">SBOM correlation</text>
  <text x="813" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f3e8ff">Vulnerability response</text>

  <rect x="70" y="258" width="820" height="98" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="480" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">ASSURANCE REQUIRES MORE THAN AN SBOM</text>
  <text x="180" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#60a5fa">Composition visibility</text>
  <text x="360" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fbbf24">Build control</text>
  <text x="540" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6ee7b7">Integrity evidence</text>
  <text x="720" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d8b4fe">Fast exposure analysis</text>
  <text x="180" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Know what is inside</text>
  <text x="360" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Know who can change it</text>
  <text x="540" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Know what was approved</text>
  <text x="720" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Know where risk lands</text>

  <text x="480" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">CISSP #53 - Inventory helps, but integrity and response complete the trust story</text>
</svg>