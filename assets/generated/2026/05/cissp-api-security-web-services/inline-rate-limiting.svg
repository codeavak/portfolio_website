<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ecff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="1000" height="500" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a3d">
    Rate Limiting: Preventing Brute-Force and Enumeration Attacks
  </text>
  
  <!-- TOP SECTION: WITHOUT Rate Limiting -->
  <text x="500" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    ❌ WITHOUT Rate Limiting
  </text>
  
  <!-- Attacker requests without limit -->
  <g filter="url(#shadow)">
    <rect x="80" y="120" width="840" height="130" fill="#fee2e2" stroke="#d32f2f" stroke-width="2" rx="8"/>
    
    <!-- Timeline of requests -->
    <text x="100" y="145" font-size="11" font-weight="bold" fill="#1a1a3d">Time</text>
    <text x="140" y="145" font-size="11" font-weight="bold" fill="#1a1a3d">Attacker makes 10,000 requests/sec:</text>
    
    <!-- Request visualizations -->
    <circle cx="160" cy="185" r="6" fill="#d32f2f"/>
    <text x="165" y="190" font-size="10" fill="#555">GET /auth?pass=1</text>
    <circle cx="190" cy="185" r="6" fill="#d32f2f"/>
    <text x="195" y="190" font-size="10" fill="#555">GET /auth?pass=2</text>
    <circle cx="220" cy="185" r="6" fill="#d32f2f"/>
    <text x="225" y="190" font-size="10" fill="#555">GET /auth?pass=3</text>
    
    <text x="280" y="190" font-size="10" fill="#555">... (thousands more)</text>
    
    <circle cx="550" cy="185" r="6" fill="#2e7d32"/>
    <text x="555" y="190" font-size="10" fill="#555">GET /auth?pass=8743</text>
    <text x="620" y="190" font-size="10" font-weight="bold" fill="#2e7d32">✓ PASSWORD FOUND</text>
    
    <!-- Outcome -->
    <rect x="90" y="220" width="820" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" rx="4"/>
    <text x="500" y="235" font-size="11" font-weight="bold" text-anchor="middle" fill="#d32f2f">
      Result: Attacker gains access in seconds. All requests processed.
    </text>
  </g>
  
  <!-- BOTTOM SECTION: WITH Rate Limiting -->
  <text x="500" y="310" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    ✓ WITH Rate Limiting: 5 requests per minute per IP
  </text>
  
  <!-- Rate-limited requests -->
  <g filter="url(#shadow)">
    <rect x="80" y="340" width="840" height="130" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
    
    <!-- Timeline -->
    <text x="100" y="365" font-size="11" font-weight="bold" fill="#1a1a3d">Time</text>
    <text x="140" y="365" font-size="11" font-weight="bold" fill="#1a1a3d">Attacker attempts brute-force:</text>
    
    <!-- Allowed requests -->
    <circle cx="160" cy="405" r="6" fill="#2e7d32"/>
    <text x="165" y="410" font-size="10" fill="#555">Req 1 ✓</text>
    <circle cx="190" cy="405" r="6" fill="#2e7d32"/>
    <text x="195" y="410" font-size="10" fill="#555">Req 2 ✓</text>
    <circle cx="220" cy="405" r="6" fill="#2e7d32"/>
    <text x="225" y="410" font-size="10" fill="#555">Req 3 ✓</text>
    <circle cx="250" cy="405" r="6" fill="#2e7d32"/>
    <text x="255" y="410" font-size="10" fill="#555">Req 4 ✓</text>
    <circle cx="280" cy="405" r="6" fill="#2e7d32"/>
    <text x="285" y="410" font-size="10" fill="#555">Req 5 ✓</text>
    
    <!-- Blocked requests -->
    <circle cx="320" cy="405" r="6" fill="#d32f2f"/>
    <text x="325" y="410" font-size="10" fill="#d32f2f">Req 6 ✗</text>
    <circle cx="350" cy="405" r="6" fill="#d32f2f"/>
    <text x="355" y="410" font-size="10" fill="#d32f2f">Req 7 ✗</text>
    <text x="390" y="410" font-size="10" fill="#d32f2f">... (all further requests blocked)</text>
    
    <!-- Message to attacker -->
    <rect x="90" y="440" width="820" height="20" fill="#fff3cd" stroke="#f59e0b" stroke-width="1" rx="4"/>
    <text x="500" y="455" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">
      429 Too Many Requests - Try again in 55 seconds
    </text>
  </g>
  
  <!-- Bottom legend -->
  <text x="100" y="500" font-size="12" font-weight="bold" fill="#1a1a3d">Impact:</text>
  <text x="280" y="500" font-size="12" fill="#555">Without rate limiting: 10,000 tries in 1 second = password found quickly</text>
  <text x="100" y="520" font-size="12" fill="#555">With rate limiting: 5 tries per minute per IP = would take 2,000 minutes = 33+ hours per IP = attack not worth it</text>
</svg>