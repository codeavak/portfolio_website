<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="attackerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="victimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    CSRF Attack Flow: When the Browser Becomes the Weapon
  </text>
  
  <!-- Step Counter -->
  <rect x="30" y="45" width="940" height="25" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="50" y="63" font-size="12" fill="#666"><tspan font-weight="bold">WITHOUT CSRF TOKEN:</tspan> Browser auto-sends cookies. Attacker forges requests.</text>
  <text x="720" y="63" font-size="12" fill="#388e3c" font-weight="bold">WITH CSRF TOKEN: Request rejected.</text>
  
  <!-- Victim Section (Top) -->
  <rect x="30" y="85" width="300" height="480" rx="8" fill="url(#victimGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="180" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">VICTIM USER</text>
  
  <rect x="50" y="135" width="260" height="70" rx="4" fill="#ffffff" stroke="#1976d2" stroke-width="1.5"/>
  <text x="180" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d47a1">1. Logs into Bank App</text>
  <text x="180" y="175" font-size="10" text-anchor="middle" fill="#666">Browser receives session cookie</text>
  <text x="180" y="189" font-size="10" text-anchor="middle" fill="#666">(stored automatically)</text>
  
  <rect x="50" y="225" width="260" height="70" rx="4" fill="#ffffff" stroke="#1976d2" stroke-width="1.5"/>
  <text x="180" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d47a1">3. Without Realizing...</text>
  <text x="180" y="263" font-size="10" text-anchor="middle" fill="#666">Visits attacker's malicious</text>
  <text x="180" y="277" font-size="10" text-anchor="middle" fill="#666">website (different domain)</text>
  
  <rect x="50" y="315" width="260" height="85" rx="4" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="180" y="335" font-size="11" font-weight="bold" text-anchor="middle" fill="#0d47a1">5. Browser Automatically</text>
  <text x="180" y="351" font-size="10" text-anchor="middle" fill="#d32f2f">Includes session cookie</text>
  <text x="180" y="365" font-size="10" text-anchor="middle" fill="#d32f2f">in cross-origin request!</text>
  <text x="180" y="381" font-size="10" text-anchor="middle" fill="#666">(This is default behavior)</text>
  
  <!-- Attacker Section (Left Bottom) -->
  <rect x="30" y="420" width="300" height="145" rx="8" fill="url(#attackerGrad)" stroke="#d32f2f" stroke-width="2"/>
  <text x="180" y="450" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">ATTACKER'S SITE</text>
  
  <rect x="50" y="470" width="260" height="75" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="180" y="490" font-size="11" font-weight="bold" text-anchor="middle" fill="#c62828">2. Hides Malicious Form</text>
  <text x="180" y="508" font-size="9" text-anchor="middle" fill="#666" font-family="monospace">&lt;form action="bank.com/transfer"</text>
  <text x="180" y="521" font-size="9" text-anchor="middle" fill="#d32f2f">method="POST"&gt;</text>
  <text x="180" y="534" font-size="9" text-anchor="middle" fill="#666">auto-submits with hidden values</text>
  
  <!-- Target Section (Right) -->
  <rect x="670" y="85" width="300" height="480" rx="8" fill="url(#targetGrad)" stroke="#388e3c" stroke-width="2"/>
  <text x="820" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">BANK APPLICATION</text>
  
  <!-- No Token Path -->
  <rect x="690" y="135" width="260" height="75" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="2"/>
  <text x="820" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">4. No CSRF Token Validation</text>
  <text x="820" y="175" font-size="10" text-anchor="middle" fill="#d32f2f">Attacker cannot access tokens</text>
  <text x="820" y="189" font-size="10" text-anchor="middle" fill="#d32f2f">(different origin)</text>
  
  <rect x="690" y="230" width="260" height="70" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="820" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">6. Processes Request!</text>
  <text x="820" y="270" font-size="10" text-anchor="middle" fill="#d32f2f">Cookie = authentication</text>
  <text x="820" y="284" font-size="10" text-anchor="middle" fill="#d32f2f">Transfers $10,000 to attacker!</text>
  
  <rect x="690" y="320" width="260" height="85" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="2"/>
  <text x="820" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">7. COMPROMISED</text>
  <text x="820" y="358" font-size="10" text-anchor="middle" fill="#666">Victim unaware</text>
  <text x="820" y="372" font-size="10" text-anchor="middle" fill="#666">Transaction logs show victim</text>
  <text x="820" y="386" font-size="10" text-anchor="middle" fill="#d32f2f">as the requester</text>
  
  <!-- THE FIX Box at Bottom -->
  <rect x="30" y="570" width="940" height="28" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="50" y="590" font-size="12" font-weight="bold" fill="#1b5e20">THE FIX: CSRF TOKENS. Server generates a unique token per user per session.</text>
  <text x="830" y="590" font-size="11" fill="#1b5e20" text-anchor="end">Token sent only to your domain. Attacker cannot forge it. Request rejected.</text>
</svg>
