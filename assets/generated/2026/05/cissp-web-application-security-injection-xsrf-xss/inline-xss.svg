<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="attackerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="victimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    XSS Attack Flow: From Input to Execution
  </text>
  
  <!-- Attacker Section -->
  <rect x="30" y="60" width="280" height="400" rx="8" fill="url(#attackerGrad)" stroke="#d32f2f" stroke-width="2"/>
  <text x="170" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">ATTACKER</text>
  
  <rect x="50" y="110" width="240" height="60" rx="4" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="170" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">Payload</text>
  <text x="170" y="150" font-size="10" text-anchor="middle" fill="#424242" font-family="monospace">
    &lt;script&gt;fetch('/steal?c='+
  </text>
  <text x="170" y="162" font-size="10" text-anchor="middle" fill="#424242" font-family="monospace">
    document.cookie)&lt;/script&gt;
  </text>
  
  <text x="170" y="210" font-size="11" text-anchor="middle" fill="#666">1. Creates malicious</text>
  <text x="170" y="224" font-size="11" text-anchor="middle" fill="#666">JavaScript payload</text>
  
  <rect x="50" y="250" width="240" height="60" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="170" y="270" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">Injection Point</text>
  <text x="170" y="290" font-size="10" text-anchor="middle" fill="#666">Submits as comment,</text>
  <text x="170" y="304" font-size="10" text-anchor="middle" fill="#666">form field, or URL param</text>
  
  <text x="170" y="350" font-size="11" text-anchor="middle" fill="#666">2. Sends payload to</text>
  <text x="170" y="364" font-size="11" text-anchor="middle" fill="#666">application</text>
  
  <!-- Arrow 1 -->
  <path d="M310,180 L390,180" stroke="#d32f2f" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  
  <!-- Server Section -->
  <rect x="390" y="60" width="280" height="400" rx="8" fill="url(#serverGrad)" stroke="#388e3c" stroke-width="2"/>
  <text x="530" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">APPLICATION</text>
  
  <rect x="410" y="110" width="240" height="70" rx="4" fill="#ffffff" stroke="#388e3c" stroke-width="1.5"/>
  <text x="530" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">3. Receives Payload</text>
  <text x="530" y="148" font-size="10" text-anchor="middle" fill="#666">No input validation</text>
  <text x="530" y="162" font-size="10" text-anchor="middle" fill="#666">or filtering applied</text>
  
  <rect x="410" y="200" width="240" height="70" rx="4" fill="#ffffff" stroke="#388e3c" stroke-width="1.5"/>
  <text x="530" y="220" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">4. Stores in Database</text>
  <text x="530" y="238" font-size="10" text-anchor="middle" fill="#666">As-is, without</text>
  <text x="530" y="252" font-size="10" text-anchor="middle" fill="#666">encoding</text>
  
  <rect x="410" y="290" width="240" height="85" rx="4" fill="#ffdddd" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="530" y="310" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">5. CRITICAL: Returns to Browser</text>
  <text x="530" y="328" font-size="10" text-anchor="middle" fill="#666">No output encoding!
  </text>
  <text x="530" y="342" font-size="10" text-anchor="middle" fill="#666">Script tag sent as-is in HTML
  </text>
  <text x="530" y="356" font-size="10" text-anchor="middle" fill="#d32f2f">Response: &lt;script&gt;fetch(...)&lt;/script&gt;</text>
  
  <!-- Arrow 2 -->
  <path d="M670,180 L750,180" stroke="#d32f2f" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  
  <!-- Victim/Browser Section -->
  <rect x="750" y="60" width="220" height="400" rx="8" fill="url(#victimGrad)" stroke="#7b1fa2" stroke-width="2"/>
  <text x="860" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#6a1b9a">VICTIM BROWSER</text>
  
  <rect x="770" y="110" width="180" height="80" rx="4" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="860" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#6a1b9a">6. Browser Parses HTML</text>
  <text x="860" y="150" font-size="9" text-anchor="middle" fill="#666">Encounters &lt;script&gt;</text>
  <text x="860" y="162" font-size="9" text-anchor="middle" fill="#666">tag in page content</text>
  <text x="860" y="176" font-size="9" text-anchor="middle" fill="#d32f2f">Interprets as code!</text>
  
  <rect x="770" y="210" width="180" height="70" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="860" y="230" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">7. Executes Script</text>
  <text x="860" y="248" font-size="9" text-anchor="middle" fill="#d32f2f">fetch('/steal?c='...)</text>
  <text x="860" y="262" font-size="9" text-anchor="middle" fill="#d32f2f">Attacker steals cookies!</text>
  
  <rect x="770" y="300" width="180" height="90" rx="4" fill="#ffcccc" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="860" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">8. Impact</text>
  <text x="860" y="338" font-size="9" text-anchor="middle" fill="#666">Session hijacking</text>
  <text x="860" y="350" font-size="9" text-anchor="middle" fill="#666">Credential theft</text>
  <text x="860" y="362" font-size="9" text-anchor="middle" fill="#666">Account takeover</text>
  <text x="860" y="376" font-size="9" text-anchor="middle" fill="#d32f2f">User compromised!</text>
  
  <!-- The Fix Box -->
  <rect x="30" y="480" width="940" height="18" rx="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="50" y="492" font-size="12" font-weight="bold" fill="#1b5e20">THE FIX: Output Encoding. Before step 5, encode the script tag:</text>
  <text x="950" y="492" font-size="11" fill="#1b5e20" text-anchor="end" font-family="monospace">
    &lt;script&gt; becomes &amp;lt;script&amp;gt; (rendered as literal text, not code)
  </text>
</svg>
