<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="500" y="35" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Web Application Security: The Code-Data Boundary
  </text>
  
  <!-- Client Side Section -->
  <rect x="30" y="80" width="420" height="580" rx="8" fill="url(#clientGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="240" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">BROWSER / CLIENT</text>
  
  <!-- HTML/JavaScript area -->
  <rect x="50" y="130" width="380" height="100" rx="6" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="240" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">HTML & JavaScript</text>
  <text x="240" y="180" font-size="12" text-anchor="middle" fill="#424242">&lt;script&gt;, &lt;img&gt;, Event Handlers</text>
  <text x="240" y="200" font-size="12" text-anchor="middle" fill="#666">XSS: Unencoded User Data</text>
  
  <!-- DOM Manipulation -->
  <rect x="50" y="250" width="380" height="80" rx="6" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="240" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">DOM Manipulation</text>
  <text x="240" y="295" font-size="12" text-anchor="middle" fill="#666">DOM-based XSS</text>
  <text x="240" y="312" font-size="11" text-anchor="middle" fill="#999">innerHTML, eval(), appendChild()</text>
  
  <!-- Session & Cookies -->
  <rect x="50" y="350" width="380" height="100" rx="6" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="240" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">Session & Cookies</text>
  <text x="240" y="398" font-size="12" text-anchor="middle" fill="#666">Auto-sent with every request</text>
  <text x="240" y="418" font-size="12" text-anchor="middle" fill="#666">CSRF: No token validation</text>
  
  <!-- User Actions -->
  <rect x="50" y="470" width="380" height="70" rx="6" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="240" y="492" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">User-Initiated Requests</text>
  <text x="240" y="512" font-size="11" text-anchor="middle" fill="#666">Forms, Fetch, XMLHttpRequest</text>
  
  <!-- Network Boundary -->
  <line x1="500" y1="80" x2="500" y2="660" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="460" y="360" width="80" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="500" y="385" font-size="12" font-weight="bold" text-anchor="middle" fill="#424242">Network</text>
  
  <!-- Server Side Section -->
  <rect x="550" y="80" width="420" height="580" rx="8" fill="url(#serverGrad)" stroke="#f57c00" stroke-width="2"/>
  <text x="760" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">SERVER / CODE</text>
  
  <!-- Query Building -->
  <rect x="570" y="130" width="380" height="100" rx="6" fill="#ffffff" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="760" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">SQL Query Building</text>
  <text x="760" y="178" font-size="11" text-anchor="middle" fill="#666">"SELECT * FROM users WHERE</text>
  <text x="760" y="195" font-size="11" text-anchor="middle" fill="#666">username = '" + input + "'"</text>
  <text x="760" y="212" font-size="12" text-anchor="middle" fill="#d32f2f">SQL Injection</text>
  
  <!-- Database & Execution -->
  <rect x="570" y="250" width="380" height="80" rx="6" fill="#ffffff" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="760" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Code Execution</text>
  <text x="760" y="298" font-size="12" text-anchor="middle" fill="#666">os.system(), exec(), eval()</text>
  <text x="760" y="315" font-size="11" text-anchor="middle" fill="#d32f2f">Command Injection</text>
  
  <!-- Deserialization -->
  <rect x="570" y="350" width="380" height="100" rx="6" fill="#ffffff" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="760" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Object Deserialization</text>
  <text x="760" y="398" font-size="11" text-anchor="middle" fill="#666">ObjectInputStream.readObject()</text>
  <text x="760" y="418" font-size="11" text-anchor="middle" fill="#666">JSON.parse(), pickle.load()</text>
  <text x="760" y="438" font-size="12" text-anchor="middle" fill="#d32f2f">Insecure Deserialization</text>
  
  <!-- Response Generation -->
  <rect x="570" y="470" width="380" height="70" rx="6" fill="#ffffff" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="760" y="492" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">Response Generation</text>
  <text x="760" y="512" font-size="11" text-anchor="middle" fill="#d32f2f">No output encoding = XSS</text>
  
  <!-- Legend -->
  <rect x="30" y="680" width="940" height="15" rx="3" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <circle cx="50" cy="687" r="3" fill="#d32f2f"/>
  <text x="60" y="690" font-size="11" fill="#424242">Critical Vulnerability</text>
  <circle cx="350" cy="687" r="3" fill="#1976d2"/>
  <text x="360" y="690" font-size="11" fill="#424242">Trust Boundary</text>
  <circle cx="620" cy="687" r="3" fill="#f57c00"/>
  <text x="630" y="690" font-size="11" fill="#424242">Code-Data Confusion Point</text>
</svg>
