<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">TLS trust validation flow</title>
  <desc id="desc">Flow diagram of certificate chain validation and revocation checks during TLS connection setup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1400" height="700" fill="url(#bg)"/>

  <text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="42" fill="#0f172a" font-weight="700">TLS Handshake Trust Model: What the Client Must Prove</text>

  <rect x="70" y="120" rx="14" ry="14" width="250" height="90" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="95" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#134e4a">Server cert received</text>

  <rect x="390" y="120" rx="14" ry="14" width="290" height="90" fill="#cffafe" stroke="#0e7490"/>
  <text x="418" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#164e63">Name + validity checks</text>

  <rect x="760" y="120" rx="14" ry="14" width="280" height="90" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="792" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#1e3a8a">Build chain to root</text>

  <rect x="1110" y="120" rx="14" ry="14" width="220" height="90" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="1135" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#4c1d95">Revocation check</text>

  <line x1="320" y1="165" x2="390" y2="165" stroke="#0f766e" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="680" y1="165" x2="760" y2="165" stroke="#0e7490" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1040" y1="165" x2="1110" y2="165" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="140" y="290" rx="12" ry="12" width="530" height="300" fill="#ffffff" stroke="#0f766e"/>
  <text x="170" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#134e4a" font-weight="700">Validation chain essentials</text>
  <text x="170" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">- SAN must match requested host</text>
  <text x="170" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">- Certificate must be in validity window</text>
  <text x="170" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">- Signatures must chain to trusted root</text>
  <text x="170" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">- Key usage and policy constraints apply</text>
  <text x="170" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">- TLS fails closed only when policy demands</text>

  <rect x="730" y="290" rx="12" ry="12" width="570" height="300" fill="#ffffff" stroke="#6d28d9"/>
  <text x="760" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#4c1d95" font-weight="700">Revocation decision tradeoff</text>
  <text x="760" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">OCSP: fresher status, runtime dependency</text>
  <text x="760" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">CRL: offline-capable, larger data and stale windows</text>
  <text x="760" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">Stapling: improves privacy and latency</text>
  <text x="760" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">Exam lens: prioritize availability vs assurance by context</text>
  <text x="760" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1e293b">Best answer maps to business impact, not elegance</text>
</svg>
