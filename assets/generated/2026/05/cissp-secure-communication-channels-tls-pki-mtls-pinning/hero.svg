<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Secure Communication Channels: TLS, PKI, mTLS, and Pinning</title>
  <desc id="desc">Concept diagram showing client, CA trust chain, TLS handshake, optional mTLS, and pinning decision overlay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#112a46"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="120" r="220" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="250" cy="760" r="280" fill="#14b8a6" fill-opacity="0.08"/>

  <text x="90" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="54" fill="#e2e8f0" font-weight="700">CISSP #63: Secure Communication Channels</text>
  <text x="90" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#bae6fd">TLS handshake trust model, PKI validation, mTLS boundaries, and pinning tradeoffs</text>

  <rect x="90" y="200" rx="20" ry="20" width="430" height="500" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="125" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" font-weight="700">Client</text>
  <text x="125" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">1. Verify server identity</text>
  <text x="125" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">2. Negotiate keys (TLS 1.3)</text>
  <text x="125" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">3. Check revocation signals</text>
  <text x="125" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">4. Optional: enforce pin set</text>
  <text x="125" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">5. Optional: present client cert</text>

  <rect x="585" y="250" rx="20" ry="20" width="430" height="420" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="620" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" font-weight="700">Server</text>
  <text x="620" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Presents certificate chain</text>
  <text x="620" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Offers supported cipher suites</text>
  <text x="620" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">May staple OCSP response</text>
  <text x="620" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Requests client cert in mTLS</text>

  <rect x="1080" y="200" rx="20" ry="20" width="430" height="500" fill="url(#card)" stroke="#99f6e4" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="1115" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" font-weight="700">Trust Anchors</text>
  <text x="1115" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Root CA in client trust store</text>
  <text x="1115" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Intermediate CA signatures</text>
  <text x="1115" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Revocation channels: OCSP / CRL</text>
  <text x="1115" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Certificate Transparency monitoring</text>

  <line x1="520" y1="420" x2="585" y2="420" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1015" y1="420" x2="1080" y2="420" stroke="#99f6e4" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="90" y="750" width="1420" height="95" rx="16" ry="16" fill="#022c22" fill-opacity="0.55" stroke="#14b8a6"/>
  <text x="120" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="#ccfbf1">CISSP best-answer mindset: choose controls by risk context and operational resilience, not by protocol trivia.</text>
</svg>
