<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">BGP Security Architecture with RPKI and Routing Controls</title>
  <desc id="desc">A layered diagram of internet route trust showing route origin validation, policy filters, monitoring, and incident response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="100%" stop-color="#153f57"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .h { font: 700 40px 'Segoe UI', Tahoma, sans-serif; fill: #f8fafc; }
      .s { font: 500 20px 'Segoe UI', Tahoma, sans-serif; fill: #dbeafe; }
      .t { font: 600 22px 'Segoe UI', Tahoma, sans-serif; fill: #e2e8f0; }
      .b { font: 500 18px 'Segoe UI', Tahoma, sans-serif; fill: #cbd5e1; }
      .k { font: 700 17px 'Segoe UI', Tahoma, sans-serif; fill: #e2e8f0; }
      .line { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <circle cx="1180" cy="130" r="220" fill="#22d3ee" opacity="0.12"/>
  <circle cx="180" cy="700" r="260" fill="#f59e0b" opacity="0.09"/>

  <text x="70" y="90" class="h">CISSP #68: BGP Security and Route Integrity</text>
  <text x="70" y="130" class="s">Route hijacking risk, origin validation with RPKI, policy filtering, and response readiness</text>

  <rect x="70" y="190" rx="18" ry="18" width="300" height="200" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="95" y="235" class="t">Internet Routing Plane</text>
  <text x="95" y="270" class="b">Autonomous system peers</text>
  <text x="95" y="300" class="b">BGP route advertisements</text>
  <text x="95" y="330" class="b">Path selection tradeoffs</text>
  <text x="95" y="365" class="k">Control: path trust assumptions</text>

  <rect x="410" y="190" rx="18" ry="18" width="300" height="200" fill="url(#card)" stroke="#34d399" stroke-opacity="0.6"/>
  <text x="435" y="235" class="t">RPKI and ROA Controls</text>
  <text x="435" y="270" class="b">Authorized origin declarations</text>
  <text x="435" y="300" class="b">Route origin validation states</text>
  <text x="435" y="330" class="b">Certificate lifecycle hygiene</text>
  <text x="435" y="365" class="k">Control: origin integrity</text>

  <rect x="750" y="190" rx="18" ry="18" width="300" height="200" fill="url(#card)" stroke="#f59e0b" stroke-opacity="0.72"/>
  <text x="775" y="235" class="t">Policy and Filtering</text>
  <text x="775" y="270" class="b">Prefix allow/deny lists</text>
  <text x="775" y="300" class="b">Max-prefix and peer limits</text>
  <text x="775" y="330" class="b">Inbound route sanity checks</text>
  <text x="775" y="365" class="k">Control: blast radius reduction</text>

  <rect x="1090" y="190" rx="18" ry="18" width="250" height="200" fill="url(#card)" stroke="#fb7185" stroke-opacity="0.75"/>
  <text x="1115" y="235" class="t">IR and Recovery</text>
  <text x="1115" y="270" class="b">Detection runbooks</text>
  <text x="1115" y="300" class="b">Provider escalation path</text>
  <text x="1115" y="330" class="b">Route withdrawal drills</text>
  <text x="1115" y="365" class="k">Control: outage containment</text>

  <rect x="200" y="480" rx="18" ry="18" width="440" height="200" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.65"/>
  <text x="230" y="525" class="t">Monitoring and Verification</text>
  <text x="230" y="560" class="b">Unexpected path change alerts</text>
  <text x="230" y="590" class="b">Prefix visibility baselining</text>
  <text x="230" y="620" class="b">Route leak signal triage</text>
  <text x="230" y="655" class="k">Control: early anomaly detection</text>

  <rect x="690" y="480" rx="18" ry="18" width="530" height="200" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.65"/>
  <text x="720" y="525" class="t">CISSP Best-Answer Lens</text>
  <text x="720" y="560" class="b">Pick layered controls that reduce hijack risk and preserve service continuity</text>
  <text x="720" y="590" class="b">Prefer measurable routing hygiene over one-time configuration claims</text>
  <text x="720" y="620" class="b">Treat internet routing as critical supply-chain infrastructure</text>
  <text x="720" y="655" class="k">Control: risk-based network governance</text>

  <path d="M 370 290 L 410 290" class="line"/>
  <path d="M 710 290 L 750 290" class="line"/>
  <path d="M 1050 290 L 1090 290" class="line"/>
  <path d="M 900 390 L 900 470" class="line"/>
  <path d="M 560 390 L 430 470" class="line"/>

  <rect x="70" y="720" width="1260" height="46" rx="10" ry="10" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.35"/>
  <text x="92" y="750" class="b">Best-answer mindset: combine RPKI validation, routing policy controls, and tested incident response to protect internet path trust.</text>
</svg>
