<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="420" fill="#f8fafc"/>

  <text x="500" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Cookie and Token Controls at the Browser Boundary</text>

  <rect x="55" y="85" width="420" height="290" rx="14" fill="#fff7ed" stroke="#f97316"/>
  <text x="265" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">Weak Configuration</text>
  <text x="90" y="160" font-size="17" fill="#7c2d12">Set-Cookie: session=abc123</text>
  <text x="90" y="188" font-size="16" fill="#7c2d12">No HttpOnly, no Secure, no SameSite</text>
  <text x="90" y="222" font-size="16" fill="#7c2d12">Token copied to localStorage</text>
  <text x="90" y="250" font-size="16" fill="#7c2d12">Long expiration, broad scope</text>
  <text x="90" y="284" font-size="16" fill="#7c2d12">Result: XSS and CSRF impact is amplified</text>
  <text x="90" y="312" font-size="16" fill="#7c2d12">Revocation lag keeps sessions alive</text>

  <rect x="525" y="85" width="420" height="290" rx="14" fill="#ecfeff" stroke="#0891b2"/>
  <text x="735" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#155e75">Hardened Configuration</text>
  <text x="560" y="160" font-size="17" fill="#0f766e">Set-Cookie: session=...; HttpOnly; Secure; SameSite=Lax</text>
  <text x="560" y="188" font-size="16" fill="#0f766e">Access token TTL minutes, not days</text>
  <text x="560" y="222" font-size="16" fill="#0f766e">Refresh token rotation and replay detection</text>
  <text x="560" y="250" font-size="16" fill="#0f766e">CSRF tokens for state-changing requests</text>
  <text x="560" y="284" font-size="16" fill="#0f766e">Server-side revocation and session telemetry</text>
  <text x="560" y="312" font-size="16" fill="#0f766e">Result: reduced blast radius after compromise</text>

  <line x1="485" y1="140" x2="515" y2="140" stroke="#64748b" stroke-width="3"/>
  <line x1="485" y1="205" x2="515" y2="205" stroke="#64748b" stroke-width="3"/>
  <line x1="485" y1="270" x2="515" y2="270" stroke="#64748b" stroke-width="3"/>
</svg>
