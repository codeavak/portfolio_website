<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="360" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Firewall Evolution: What Each Generation Can See</text>

  <!-- Generation boxes -->
  <!-- Gen 1: Packet Filter -->
  <rect x="30" y="60" width="180" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="60" width="180" height="34" rx="10" fill="#1e3b2a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="30" y="84" width="180" height="10" rx="0" fill="#1e3b2a"/>
  <text x="120" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Packet Filter</text>
  <text x="120" y="115" text-anchor="middle" font-size="10" fill="#4ade80">✓ Source IP</text>
  <text x="120" y="133" text-anchor="middle" font-size="10" fill="#4ade80">✓ Dest IP</text>
  <text x="120" y="151" text-anchor="middle" font-size="10" fill="#4ade80">✓ Port numbers</text>
  <text x="120" y="169" text-anchor="middle" font-size="10" fill="#4ade80">✓ Protocol (TCP/UDP)</text>
  <text x="120" y="196" text-anchor="middle" font-size="10" fill="#ef4444">✗ Session state</text>
  <text x="120" y="214" text-anchor="middle" font-size="10" fill="#ef4444">✗ Payload content</text>
  <text x="120" y="232" text-anchor="middle" font-size="10" fill="#ef4444">✗ Application identity</text>

  <!-- Gen 2: Stateful -->
  <rect x="230" y="60" width="180" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="230" y="60" width="180" height="34" rx="10" fill="#1e3b2a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="230" y="84" width="180" height="10" rx="0" fill="#1e3b2a"/>
  <text x="320" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Stateful Inspection</text>
  <text x="320" y="115" text-anchor="middle" font-size="10" fill="#4ade80">✓ Source / Dest IP + port</text>
  <text x="320" y="133" text-anchor="middle" font-size="10" fill="#4ade80">✓ Connection state table</text>
  <text x="320" y="151" text-anchor="middle" font-size="10" fill="#4ade80">✓ New vs established</text>
  <text x="320" y="169" text-anchor="middle" font-size="10" fill="#4ade80">✓ SYN flood detection</text>
  <text x="320" y="196" text-anchor="middle" font-size="10" fill="#ef4444">✗ Payload content</text>
  <text x="320" y="214" text-anchor="middle" font-size="10" fill="#ef4444">✗ Application identity</text>
  <text x="320" y="232" text-anchor="middle" font-size="10" fill="#64748b">  (most common today)</text>

  <!-- Gen 3: App-layer -->
  <rect x="430" y="60" width="180" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="430" y="60" width="180" height="34" rx="10" fill="#1a2a3a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="430" y="84" width="180" height="10" rx="0" fill="#1a2a3a"/>
  <text x="520" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#7dd3fc">App-Layer / Proxy</text>
  <text x="520" y="115" text-anchor="middle" font-size="10" fill="#4ade80">✓ Full payload inspection</text>
  <text x="520" y="133" text-anchor="middle" font-size="10" fill="#4ade80">✓ HTTP verb, URL, body</text>
  <text x="520" y="151" text-anchor="middle" font-size="10" fill="#4ade80">✓ Terminates connection</text>
  <text x="520" y="169" text-anchor="middle" font-size="10" fill="#4ade80">✓ Deep protocol validation</text>
  <text x="520" y="196" text-anchor="middle" font-size="10" fill="#ef4444">✗ Higher latency</text>
  <text x="520" y="214" text-anchor="middle" font-size="10" fill="#ef4444">✗ TLS blind (without break)</text>
  <text x="520" y="232" text-anchor="middle" font-size="10" fill="#ef4444">✗ No user/app identity</text>

  <!-- Gen 4: NGFW -->
  <rect x="630" y="60" width="200" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="630" y="60" width="200" height="34" rx="10" fill="#2d1b4e" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="630" y="84" width="200" height="10" rx="0" fill="#2d1b4e"/>
  <text x="730" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">Next-Gen (NGFW)</text>
  <text x="730" y="115" text-anchor="middle" font-size="10" fill="#4ade80">✓ All stateful capabilities</text>
  <text x="730" y="133" text-anchor="middle" font-size="10" fill="#4ade80">✓ App-aware (not just port)</text>
  <text x="730" y="151" text-anchor="middle" font-size="10" fill="#4ade80">✓ User identity (AD/LDAP)</text>
  <text x="730" y="169" text-anchor="middle" font-size="10" fill="#4ade80">✓ Built-in IPS engine</text>
  <text x="730" y="187" text-anchor="middle" font-size="10" fill="#4ade80">✓ TLS inspection capable</text>
  <text x="730" y="214" text-anchor="middle" font-size="10" fill="#f59e0b">≠ WAF (no HTTP payload)</text>
  <text x="730" y="232" text-anchor="middle" font-size="10" fill="#f59e0b">≠ NAC (no posture check)</text>

  <!-- When to use section -->
  <line x1="30" y1="258" x2="830" y2="258" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">When the exam asks which firewall type —</text>
  <text x="430" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">Stateless performance needs → Packet filter · Session-level threats → Stateful · Deep HTTP inspection → App-layer</text>
  <text x="430" y="318" text-anchor="middle" font-size="10" fill="#94a3b8">App/user-aware policy, modern enterprise perimeter → NGFW</text>
  <text x="430" y="342" text-anchor="middle" font-size="9" fill="#334155">CISSP Domain 4 — Communication and Network Security</text>
</svg>
