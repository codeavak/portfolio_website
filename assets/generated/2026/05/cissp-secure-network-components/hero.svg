<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="480" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5f9">Secure Network Components</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#94a3b8">Firewalls · WAFs · Proxies · IDS · IPS · NAC</text>

  <!-- Internet cloud label -->
  <rect x="20" y="100" width="120" height="54" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="80" y="122" text-anchor="middle" font-size="11" fill="#94a3b8">Internet</text>
  <text x="80" y="140" text-anchor="middle" font-size="10" fill="#64748b">Untrusted</text>

  <!-- Arrow: Internet → NAC -->
  <line x1="140" y1="127" x2="190" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NAC box -->
  <rect x="190" y="100" width="110" height="54" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="245" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">NAC</text>
  <text x="245" y="140" text-anchor="middle" font-size="9" fill="#60a5fa">Who gets on?</text>

  <!-- Arrow: NAC → Firewall -->
  <line x1="300" y1="127" x2="350" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Firewall box -->
  <rect x="350" y="100" width="130" height="54" rx="8" fill="#1e3b2a" stroke="#22c55e" stroke-width="1.8"/>
  <text x="415" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#86efac">Firewall</text>
  <text x="415" y="133" text-anchor="middle" font-size="9" fill="#4ade80">Packet / Stateful</text>
  <text x="415" y="146" text-anchor="middle" font-size="9" fill="#4ade80">App-layer / NGFW</text>

  <!-- Arrow: Firewall → IDS/IPS -->
  <line x1="480" y1="127" x2="530" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- IDS/IPS box -->
  <rect x="530" y="100" width="120" height="54" rx="8" fill="#3b1f1f" stroke="#f87171" stroke-width="1.8"/>
  <text x="590" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">IDS / IPS</text>
  <text x="590" y="140" text-anchor="middle" font-size="9" fill="#f87171">Detect · Prevent</text>

  <!-- Arrow: IDS/IPS → WAF -->
  <line x1="650" y1="127" x2="700" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WAF box -->
  <rect x="700" y="100" width="110" height="54" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="755" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#c4b5fd">WAF</text>
  <text x="755" y="140" text-anchor="middle" font-size="9" fill="#a78bfa">Web app layer</text>

  <!-- Arrow: WAF → App -->
  <line x1="810" y1="127" x2="850" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- App server label -->
  <rect x="850" y="108" width="34" height="38" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="867" y="125" text-anchor="middle" font-size="9" fill="#94a3b8">App</text>
  <text x="867" y="138" text-anchor="middle" font-size="9" fill="#64748b">Server</text>

  <!-- Proxy row -->
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#64748b">─── Proxy Layer ───</text>

  <!-- Forward Proxy -->
  <rect x="220" y="215" width="160" height="60" rx="8" fill="#1e2d3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">Forward Proxy</text>
  <text x="300" y="252" text-anchor="middle" font-size="9" fill="#38bdf8">Internal users → Internet</text>
  <text x="300" y="266" text-anchor="middle" font-size="9" fill="#38bdf8">Content filter · Outbound TLS</text>

  <!-- Reverse Proxy -->
  <rect x="510" y="215" width="165" height="60" rx="8" fill="#1e2d3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="592" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">Reverse Proxy</text>
  <text x="592" y="252" text-anchor="middle" font-size="9" fill="#38bdf8">Internet → Internal servers</text>
  <text x="592" y="266" text-anchor="middle" font-size="9" fill="#38bdf8">Hides origin · TLS termination</text>

  <!-- Divider -->
  <line x1="40" y1="305" x2="860" y2="305" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Key differences table header -->
  <text x="450" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">Device Selection by Threat</text>

  <!-- Column headers -->
  <text x="110" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">Device</text>
  <text x="330" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">Threat Addressed</text>
  <text x="590" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">Key Characteristic</text>
  <line x1="40" y1="360" x2="860" y2="360" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="110" y="378" text-anchor="middle" font-size="10" fill="#86efac">Packet-Filter FW</text>
  <text x="330" y="378" text-anchor="middle" font-size="10" fill="#94a3b8">IP/port-based attacks</text>
  <text x="590" y="378" text-anchor="middle" font-size="10" fill="#64748b">Stateless · Fast · No session context</text>

  <!-- Row 2 -->
  <text x="110" y="396" text-anchor="middle" font-size="10" fill="#86efac">Stateful FW</text>
  <text x="330" y="396" text-anchor="middle" font-size="10" fill="#94a3b8">Session hijacking, spoofed packets</text>
  <text x="590" y="396" text-anchor="middle" font-size="10" fill="#64748b">Tracks connection state table</text>

  <!-- Row 3 -->
  <text x="110" y="414" text-anchor="middle" font-size="10" fill="#c4b5fd">WAF</text>
  <text x="330" y="414" text-anchor="middle" font-size="10" fill="#94a3b8">SQLi, XSS, CSRF, OWASP Top 10</text>
  <text x="590" y="414" text-anchor="middle" font-size="10" fill="#64748b">HTTP/S payload inspection only</text>

  <!-- Row 4 -->
  <text x="110" y="432" text-anchor="middle" font-size="10" fill="#fca5a5">IPS</text>
  <text x="330" y="432" text-anchor="middle" font-size="10" fill="#94a3b8">Known exploits, anomalous traffic</text>
  <text x="590" y="432" text-anchor="middle" font-size="10" fill="#64748b">Inline · Drops malicious traffic</text>

  <!-- Row 5 -->
  <text x="110" y="450" text-anchor="middle" font-size="10" fill="#93c5fd">NAC</text>
  <text x="330" y="450" text-anchor="middle" font-size="10" fill="#94a3b8">Rogue / non-compliant endpoints</text>
  <text x="590" y="450" text-anchor="middle" font-size="10" fill="#64748b">Posture check before network access</text>

  <!-- Footer -->
  <text x="450" y="472" text-anchor="middle" font-size="9" fill="#334155">CISSP Domain 4 — Communication and Network Security</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>
</svg>
