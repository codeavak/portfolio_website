<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="380" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">IDS vs IPS Placement · NAC Decision Flow</text>

  <!-- === IDS/IPS LEFT HALF === -->
  <!-- Traffic stream -->
  <rect x="30" y="66" width="76" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="68" y="87" text-anchor="middle" font-size="10" fill="#94a3b8">Traffic</text>

  <!-- Arrow forward -->
  <line x1="106" y1="82" x2="240" y2="82" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- SPAN tap branch for IDS -->
  <circle cx="172" cy="82" r="4" fill="#38bdf8"/>
  <line x1="172" y1="82" x2="172" y2="155" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- IDS box (out-of-band) -->
  <rect x="112" y="155" width="120" height="54" rx="8" fill="#1a2a3a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="172" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#7dd3fc">IDS</text>
  <text x="172" y="192" text-anchor="middle" font-size="9" fill="#38bdf8">Out-of-band (SPAN port)</text>
  <text x="172" y="206" text-anchor="middle" font-size="9" fill="#38bdf8">Detect only · No blocking</text>

  <!-- Alert arrow from IDS -->
  <line x1="172" y1="209" x2="172" y2="240" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <text x="172" y="258" text-anchor="middle" font-size="9" fill="#fbbf24">Alert / Log</text>

  <!-- IPS box (inline) -->
  <rect x="250" y="60" width="120" height="46" rx="8" fill="#3b1f1f" stroke="#f87171" stroke-width="1.8"/>
  <text x="310" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">IPS</text>
  <text x="310" y="96" text-anchor="middle" font-size="9" fill="#f87171">Inline · Drops packets</text>

  <!-- Arrow through IPS -->
  <line x1="370" y1="82" x2="420" y2="82" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="420" y="66" width="76" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="458" y="87" text-anchor="middle" font-size="10" fill="#94a3b8">Destination</text>

  <!-- Label: signature vs anomaly -->
  <text x="40" y="295" font-size="10" font-weight="600" fill="#cbd5e1">Detection Methods</text>
  <rect x="40" y="308" width="220" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="326" font-size="9" fill="#86efac">Signature-based:</text>
  <text x="50" y="342" font-size="9" fill="#94a3b8">Known threat patterns · Low false positive</text>
  <text x="50" y="356" font-size="9" fill="#f87171">Blind to zero-days</text>

  <rect x="275" y="308" width="220" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="285" y="326" font-size="9" fill="#86efac">Anomaly-based:</text>
  <text x="285" y="342" font-size="9" fill="#94a3b8">Deviation from baseline · Catches novel</text>
  <text x="285" y="356" font-size="9" fill="#f87171">Higher false positive rate</text>

  <!-- Vertical divider -->
  <line x1="530" y1="55" x2="530" y2="375" stroke="#1e293b" stroke-width="2"/>

  <!-- === NAC RIGHT HALF === -->
  <text x="695" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">NAC Decision Flow</text>

  <!-- Device connects -->
  <rect x="630" y="85" width="130" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="695" y="108" text-anchor="middle" font-size="10" fill="#94a3b8">Device connects to network</text>

  <!-- Arrow down -->
  <line x1="695" y1="121" x2="695" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 802.1X Auth check -->
  <rect x="630" y="148" width="130" height="38" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="695" y="165" text-anchor="middle" font-size="10" fill="#93c5fd">802.1X Auth</text>
  <text x="695" y="180" text-anchor="middle" font-size="9" fill="#60a5fa">Identity verified?</text>

  <!-- Fail branch left -->
  <line x1="630" y1="167" x2="572" y2="167" stroke="#f87171" stroke-width="1.2" marker-end="url(#a4)"/>
  <text x="601" y="162" text-anchor="middle" font-size="9" fill="#f87171">No</text>
  <rect x="530" y="155" width="42" height="24" rx="4" fill="#3b1f1f" stroke="#f87171" stroke-width="1"/>
  <text x="551" y="171" text-anchor="middle" font-size="8" fill="#fca5a5">Deny</text>

  <!-- Arrow down from auth -->
  <line x1="695" y1="186" x2="695" y2="213" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Posture check -->
  <rect x="630" y="213" width="130" height="38" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="695" y="230" text-anchor="middle" font-size="10" fill="#93c5fd">Posture Check</text>
  <text x="695" y="245" text-anchor="middle" font-size="9" fill="#60a5fa">AV, patch, policy?</text>

  <!-- Fail branch left -->
  <line x1="630" y1="232" x2="572" y2="232" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#a5)"/>
  <text x="601" y="227" text-anchor="middle" font-size="9" fill="#fbbf24">Fail</text>
  <rect x="530" y="220" width="42" height="24" rx="4" fill="#2d2008" stroke="#fbbf24" stroke-width="1"/>
  <text x="551" y="236" text-anchor="middle" font-size="8" fill="#fbbf24">Quar.</text>

  <!-- Arrow down -->
  <line x1="695" y1="251" x2="695" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Grant access -->
  <rect x="630" y="278" width="130" height="36" rx="8" fill="#1e3b2a" stroke="#22c55e" stroke-width="1.8"/>
  <text x="695" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Access Granted</text>
  <text x="695" y="309" text-anchor="middle" font-size="9" fill="#4ade80">Assigned VLAN / role</text>

  <!-- Note -->
  <text x="695" y="345" text-anchor="middle" font-size="9" fill="#64748b">NAC key exam signal: BYOD · unmanaged devices</text>
  <text x="695" y="360" text-anchor="middle" font-size="9" fill="#64748b">· guest access · rogue endpoint control</text>

  <!-- Footer -->
  <text x="430" y="375" text-anchor="middle" font-size="9" fill="#334155">CISSP Domain 4 — Communication and Network Security</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171"/>
    </marker>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>
</svg>
