<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Automated tooling versus secure code review comparison">
  <rect width="900" height="280" rx="12" fill="#0f172a"/>
  <text x="450" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f8fafc">What Tools Catch vs What Reviewers Catch</text>

  <rect x="34" y="68" width="390" height="170" rx="10" fill="#13263f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="229" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#bfdbfe">Automated Tooling Strengths</text>
  <line x1="66" y1="106" x2="392" y2="106" stroke="#60a5fa" stroke-width="1"/>
  <text x="84" y="132" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">- Known unsafe patterns and sinks</text>
  <text x="84" y="158" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">- Dependency and CVE matching</text>
  <text x="84" y="184" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">- Hardcoded secrets and policy violations</text>
  <text x="84" y="210" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">- Fast, repeatable baseline coverage</text>

  <rect x="476" y="68" width="390" height="170" rx="10" fill="#10281e" stroke="#34d399" stroke-width="1.5"/>
  <text x="671" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#86efac">Secure Review Strengths</text>
  <line x1="508" y1="106" x2="834" y2="106" stroke="#34d399" stroke-width="1"/>
  <text x="526" y="132" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">- Authorization and trust-boundary mistakes</text>
  <text x="526" y="158" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">- Business logic abuse and workflow gaps</text>
  <text x="526" y="184" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">- Dangerous fallback and exception handling</text>
  <text x="526" y="210" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">- Security intent drift after refactors</text>

  <text x="450" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Secure software assurance gets stronger when pattern detection and context review work together.</text>
</svg>