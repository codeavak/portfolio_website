<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Email Security Architecture: SPF, DKIM, DMARC, and Anti-BEC Controls</title>
  <desc id="desc">A layered enterprise email security model showing sender authentication, DMARC enforcement, user controls, and response workflows against business email compromise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#123b52"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .h { font: 700 40px 'Segoe UI', Tahoma, sans-serif; fill: #f8fafc; }
      .s { font: 500 20px 'Segoe UI', Tahoma, sans-serif; fill: #dbeafe; }
      .t { font: 600 22px 'Segoe UI', Tahoma, sans-serif; fill: #e2e8f0; }
      .b { font: 500 18px 'Segoe UI', Tahoma, sans-serif; fill: #cbd5e1; }
      .k { font: 700 17px 'Segoe UI', Tahoma, sans-serif; fill: #e2e8f0; }
      .line { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <circle cx="1180" cy="130" r="220" fill="#22d3ee" opacity="0.12"/>
  <circle cx="170" cy="710" r="260" fill="#f59e0b" opacity="0.09"/>

  <text x="70" y="90" class="h">CISSP #66: Email Security as a Trust System</text>
  <text x="70" y="130" class="s">SPF, DKIM, DMARC alignment, sender reputation, and anti-BEC process controls</text>

  <rect x="70" y="190" rx="18" ry="18" width="290" height="200" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="95" y="235" class="t">Sending Systems</text>
  <text x="95" y="270" class="b">Marketing platform</text>
  <text x="95" y="300" class="b">Business app notifications</text>
  <text x="95" y="330" class="b">Support and identity mail</text>
  <text x="95" y="365" class="k">Control: inventory + ownership</text>

  <rect x="390" y="190" rx="18" ry="18" width="290" height="200" fill="url(#card)" stroke="#34d399" stroke-opacity="0.6"/>
  <text x="415" y="235" class="t">Domain Authentication</text>
  <text x="415" y="270" class="b">SPF sender authorization</text>
  <text x="415" y="300" class="b">DKIM message signing</text>
  <text x="415" y="330" class="b">Key rotation operations</text>
  <text x="415" y="365" class="k">Control: identity signal quality</text>

  <rect x="710" y="190" rx="18" ry="18" width="320" height="200" fill="url(#card)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="735" y="235" class="t">DMARC Policy and Reports</text>
  <text x="735" y="270" class="b">Alignment to From domain</text>
  <text x="735" y="300" class="b">p=none to quarantine to reject</text>
  <text x="735" y="330" class="b">Aggregate report feedback loop</text>
  <text x="735" y="365" class="k">Control: enforceable trust policy</text>

  <rect x="1060" y="190" rx="18" ry="18" width="280" height="200" fill="url(#card)" stroke="#fb7185" stroke-opacity="0.75"/>
  <text x="1085" y="235" class="t">BEC Risk Controls</text>
  <text x="1085" y="270" class="b">Dual approval for payments</text>
  <text x="1085" y="300" class="b">Out-of-band verification</text>
  <text x="1085" y="330" class="b">Mailbox monitoring and IR</text>
  <text x="1085" y="365" class="k">Control: process resilience</text>

  <rect x="170" y="480" rx="18" ry="18" width="460" height="200" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.65"/>
  <text x="200" y="525" class="t">Receiver-Side Validation</text>
  <text x="200" y="560" class="b">Authentication checks + reputation filtering</text>
  <text x="200" y="590" class="b">Spoofing and phishing classification</text>
  <text x="200" y="620" class="b">Mailbox controls and user reporting channel</text>
  <text x="200" y="655" class="k">Control: layered inbound defense</text>

  <rect x="670" y="480" rx="18" ry="18" width="560" height="200" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.65"/>
  <text x="700" y="525" class="t">Governance and CISSP Best-Answer Lens</text>
  <text x="700" y="560" class="b">Treat email security as people, process, and technology together</text>
  <text x="700" y="590" class="b">Prefer monitored rollout and measurable policy maturity</text>
  <text x="700" y="620" class="b">Choose controls that reduce fraud risk without breaking business flow</text>
  <text x="700" y="655" class="k">Control: risk-based security decisions</text>

  <path d="M 360 290 L 390 290" class="line"/>
  <path d="M 680 290 L 710 290" class="line"/>
  <path d="M 1030 290 L 1060 290" class="line"/>
  <path d="M 880 390 L 880 470" class="line"/>
  <path d="M 540 390 L 420 470" class="line"/>

  <rect x="70" y="720" width="1260" height="46" rx="10" ry="10" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.35"/>
  <text x="92" y="750" class="b">Best-answer mindset: start with sender authenticity, enforce policy with DMARC, then close process gaps that make BEC successful.</text>
</svg>
