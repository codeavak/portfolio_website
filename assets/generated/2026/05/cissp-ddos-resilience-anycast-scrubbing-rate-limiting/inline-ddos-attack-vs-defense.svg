<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">DDoS Attack Flow Versus Layered Defense</title>
  <desc id="desc">Side-by-side view of uncontrolled DDoS impact versus layered mitigation with edge filtering, scrubbing, and app controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <style>
      .h { font: 700 34px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .s { font: 600 20px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
      .b { font: 500 18px 'Segoe UI', Tahoma, sans-serif; fill: #1e293b; }
      .k { font: 700 18px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="60" y="70" class="h">DDoS Outcome Depends on Architecture, Not Intent</text>

  <rect x="60" y="110" width="520" height="460" rx="16" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <text x="90" y="160" class="s">Unprepared Path</text>
  <text x="90" y="210" class="b">- Attack traffic saturates edge capacity</text>
  <text x="90" y="250" class="b">- Connection queues collapse service responsiveness</text>
  <text x="90" y="290" class="b">- Legitimate users are dropped with attackers</text>
  <text x="90" y="330" class="b">- Incident response starts too late</text>
  <text x="90" y="370" class="b">- Business outage duration expands</text>
  <text x="90" y="440" class="k">Outcome: availability loss and customer impact</text>

  <rect x="620" y="110" width="520" height="460" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="160" class="s">Layered Resilient Path</text>
  <text x="650" y="210" class="b">- Anycast spreads flood pressure across regions</text>
  <text x="650" y="250" class="b">- Scrubbing and filtering remove hostile traffic</text>
  <text x="650" y="290" class="b">- App-level rate controls preserve critical APIs</text>
  <text x="650" y="330" class="b">- Automated triggers activate mitigation quickly</text>
  <text x="650" y="370" class="b">- Users see degraded but available service</text>
  <text x="650" y="440" class="k">Outcome: controlled degradation and recovery</text>

  <line x1="600" y1="130" x2="600" y2="560" stroke="#94a3b8" stroke-dasharray="8 8"/>
  <text x="250" y="610" class="b">CISSP lens: strong answers prioritize continuity through layered controls and operational readiness.</text>
</svg>
