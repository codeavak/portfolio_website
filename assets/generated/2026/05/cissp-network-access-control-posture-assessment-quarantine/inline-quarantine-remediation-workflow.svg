<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Quarantine and Remediation Workflow</title>
  <desc id="desc">Workflow showing how noncompliant endpoints enter quarantine, receive remediation, and regain staged access.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="url(#bg3)"/>
  <text x="60" y="78" fill="#eef2ff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Quarantine to Recovery Workflow</text>
  <text x="60" y="116" fill="#c7d2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Contain first, remediate quickly, restore least-privilege access in stages</text>

  <rect x="80" y="180" width="240" height="130" rx="14" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2"/>
  <text x="105" y="235" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">1. Isolate</text>
  <text x="105" y="268" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="20">Move to quarantine VLAN</text>

  <rect x="370" y="180" width="240" height="130" rx="14" fill="#92400e" stroke="#fbbf24" stroke-width="2"/>
  <text x="395" y="235" fill="#fffbeb" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">2. Diagnose</text>
  <text x="395" y="268" fill="#fffbeb" font-family="Segoe UI, Arial, sans-serif" font-size="20">Find failed controls</text>

  <rect x="660" y="180" width="240" height="130" rx="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <text x="685" y="235" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">3. Remediate</text>
  <text x="685" y="268" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20">Patch, EDR, config fix</text>

  <rect x="950" y="180" width="240" height="130" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="975" y="235" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">4. Revalidate</text>
  <text x="975" y="268" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="20">Posture passes checks</text>

  <line x1="320" y1="245" x2="370" y2="245" stroke="#a5b4fc" stroke-width="5" marker-end="url(#arr3)"/>
  <line x1="610" y1="245" x2="660" y2="245" stroke="#a5b4fc" stroke-width="5" marker-end="url(#arr3)"/>
  <line x1="900" y1="245" x2="950" y2="245" stroke="#a5b4fc" stroke-width="5" marker-end="url(#arr3)"/>

  <rect x="80" y="370" width="1260" height="320" rx="14" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="425" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Operating Requirements</text>

  <text x="120" y="485" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Define clear quarantine criteria and ownership to avoid endless limbo states</text>
  <text x="120" y="532" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Provide remediation services in quarantine so recovery is feasible, not punitive</text>
  <text x="120" y="579" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Use staged restoration: restricted access first, then production access</text>
  <text x="120" y="626" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Track recurrence trends to improve baseline posture policy</text>

  <text x="900" y="485" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Success indicators:</text>
  <text x="900" y="525" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Rapid noncompliant endpoint isolation</text>
  <text x="900" y="560" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Shorter remediation cycle times</text>
  <text x="900" y="595" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Lower repeat quarantine rate</text>
</svg>
