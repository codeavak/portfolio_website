<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CISSP 74 Network Access Control and Posture Enforcement</title>
  <desc id="desc">Network access control architecture showing device identity, posture checks, policy decision, and quarantine paths for noncompliant endpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="70" y="84" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">CISSP #74: NAC Posture Enforcement and Quarantine Design</text>
  <text x="70" y="126" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="26">Admit trusted devices, restrict unknowns, isolate noncompliant endpoints quickly</text>

  <rect x="70" y="190" width="420" height="230" rx="16" fill="url(#cardA)" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="246" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Access Request</text>
  <text x="100" y="288" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">802.1X or equivalent auth</text>
  <text x="100" y="322" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">User + device identity</text>
  <text x="100" y="356" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Certificate-backed trust</text>

  <rect x="585" y="190" width="420" height="230" rx="16" fill="#065f46" stroke="#34d399" stroke-width="2"/>
  <text x="615" y="246" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Policy Decision</text>
  <text x="615" y="288" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">Posture checks (EDR/MDM)</text>
  <text x="615" y="322" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">Role and segment mapping</text>
  <text x="615" y="356" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">Least-privilege admission</text>

  <rect x="1100" y="190" width="420" height="230" rx="16" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="1130" y="246" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Enforcement Paths</text>
  <text x="1130" y="288" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Production VLAN / segment</text>
  <text x="1130" y="322" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Restricted access profile</text>
  <text x="1130" y="356" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Quarantine remediation zone</text>

  <line x1="490" y1="306" x2="585" y2="306" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1005" y1="306" x2="1100" y2="306" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="70" y="470" width="1460" height="330" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="105" y="530" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600">Operational Discipline Loop</text>

  <circle cx="140" cy="598" r="16" fill="#38bdf8"/>
  <text x="175" y="606" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Define admission policy by asset class and risk tolerance</text>

  <circle cx="140" cy="660" r="16" fill="#38bdf8"/>
  <text x="175" y="668" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Automate posture telemetry ingestion for continuous validation</text>

  <circle cx="140" cy="722" r="16" fill="#38bdf8"/>
  <text x="175" y="730" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Review exceptions and quarantine outcomes to tighten policy</text>

  <text x="970" y="598" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Security outcome:</text>
  <text x="970" y="636" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Lower unauthorized access risk</text>
  <text x="970" y="670" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Faster containment of unhealthy endpoints</text>
  <text x="970" y="704" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Cleaner audit and accountability trail</text>
</svg>
