<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry Coverage Model for Encrypted Networks</title>
  <desc id="desc">Comparison of packet-only visibility versus layered telemetry strategy using flow, endpoint, and identity context.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="780" fill="url(#bg2)"/>
  <text x="60" y="72" fill="#f9fafb" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Encrypted-Era Visibility Model</text>
  <text x="60" y="110" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Layered telemetry gives better security signal quality than packet-only dependence</text>

  <rect x="60" y="170" width="610" height="510" rx="14" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2"/>
  <text x="92" y="220" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Packet-Only Model</text>
  <text x="92" y="270" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="23">Strength:</text>
  <text x="92" y="305" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Deep payload inspection where available</text>
  <text x="92" y="360" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="23">Weakness:</text>
  <text x="92" y="395" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="22">Visibility drops as encryption expands</text>
  <text x="92" y="430" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="22">High storage and processing cost</text>
  <text x="92" y="465" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="22">Limited practical enterprise-wide retention</text>

  <rect x="730" y="170" width="610" height="510" rx="14" fill="#065f46" stroke="#6ee7b7" stroke-width="2"/>
  <text x="762" y="220" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Layered Telemetry Model</text>
  <text x="762" y="270" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="23">Components:</text>
  <text x="762" y="305" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Flow metadata (NetFlow/IPFIX)</text>
  <text x="762" y="340" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Endpoint activity signals</text>
  <text x="762" y="375" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Identity and access context</text>
  <text x="762" y="430" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="23">Benefits:</text>
  <text x="762" y="465" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="22">Resilient encrypted-traffic visibility</text>
  <text x="762" y="500" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="22">Better anomaly correlation</text>
  <text x="762" y="535" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="22">More actionable incident scoping</text>

  <text x="60" y="735" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="22">CISSP takeaway: visibility design must adapt to encryption and business-scale monitoring constraints.</text>
</svg>
