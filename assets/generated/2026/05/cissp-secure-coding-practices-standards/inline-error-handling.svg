<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="450" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Error Handling: Detailed Logs vs. Generic User Responses
  </text>
  
  <!-- LEFT SIDE: Internal Detailed Logging -->
  <rect x="40" y="60" width="380" height="340" fill="#f0f4f8" stroke="#0c4a6e" stroke-width="2" rx="4"/>
  
  <text x="230" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
    Internal Log (Your Team)
  </text>
  
  <!-- Log content -->
  <rect x="55" y="105" width="350" height="260" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="2"/>
  
  <text x="65" y="125" font-size="10" font-family="monospace" fill="#1e293b">
    [ERROR] 2026-05-08 14:32:15
  </text>
  
  <text x="65" y="145" font-size="10" font-family="monospace" fill="#1e293b">
    Query: SELECT * FROM users
  </text>
  <text x="65" y="160" font-size="10" font-family="monospace" fill="#1e293b">
    WHERE id = ?
  </text>
  
  <text x="65" y="180" font-size="10" font-family="monospace" fill="#1e293b">
    Params: [12345]
  </text>
  
  <text x="65" y="200" font-size="10" font-family="monospace" fill="#dc2626">
    Error: Database connection lost
  </text>
  
  <text x="65" y="220" font-size="10" font-family="monospace" fill="#0c4a6e">
    Stack:
  </text>
  <text x="65" y="235" font-size="9" font-family="monospace" fill="#0c4a6e">
    at Database.query() (db.js:142)
  </text>
  <text x="65" y="250" font-size="9" font-family="monospace" fill="#0c4a6e">
    at getUser() (users.js:58)
  </text>
  <text x="65" y="265" font-size="9" font-family="monospace" fill="#0c4a6e">
    at handler() (route.js:23)
  </text>
  
  <text x="65" y="285" font-size="10" font-family="monospace" fill="#0c4a6e">
    Duration: 523ms
  </text>
  <text x="65" y="300" font-size="10" font-family="monospace" fill="#0c4a6e">
    User: john.doe@example.com
  </text>
  <text x="65" y="315" font-size="10" font-family="monospace" fill="#0c4a6e">
    IP: 192.168.1.100
  </text>
  <text x="65" y="330" font-size="10" font-family="monospace" fill="#0c4a6e">
    Request ID: abc123def456
  </text>
  
  <text x="65" y="350" font-size="9" fill="#16a34a">
    ✓ Useful for debugging
  </text>
  <text x="65" y="363" font-size="9" fill="#16a34a">
    ✓ See exact error cause
  </text>
</rect>
  
  <!-- Arrow in middle -->
  <g>
    <line x1="450" y1="240" x2="550" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowgray)"/>
    <text x="500" y="230" font-size="11" text-anchor="middle" fill="#64748b" font-weight="bold">
      Transform
    </text>
  </g>
  
  <!-- RIGHT SIDE: Generic User Response -->
  <rect x="580" y="60" width="380" height="340" fill="#f0fdf4" stroke="#166534" stroke-width="2" rx="4"/>
  
  <text x="770" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">
    User Response (External)
  </text>
  
  <!-- Response content -->
  <rect x="595" y="105" width="350" height="260" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="2"/>
  
  <text x="605" y="155" font-size="12" text-anchor="middle" fill="#1e293b">
    {
  </text>
  
  <text x="620" y="180" font-size="12" font-family="monospace" fill="#1e293b">
    "error": "An error occurred"
  </text>
  
  <text x="605" y="205" font-size="12" text-anchor="middle" fill="#1e293b">
    }
  </text>
  
  <text x="770" y="260" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="bold">
    NO INFORMATION LEAKAGE
  </text>
  
  <text x="770" y="285" font-size="9" text-anchor="middle" fill="#991b1b">
    ✗ No database details
  </text>
  <text x="770" y="300" font-size="9" text-anchor="middle" fill="#991b1b">
    ✗ No code paths shown
  </text>
  <text x="770" y="315" font-size="9" text-anchor="middle" fill="#991b1b">
    ✗ No stack traces
  </text>
  <text x="770" y="330" font-size="9" text-anchor="middle" fill="#991b1b">
    ✗ No system architecture
  </text>
  
  <circle cx="770" cy="360" r="3" fill="#16a34a"/>
  <text x="785" y="365" font-size="9" fill="#166534">
    Safe for attacker to see
  </text>
</rect>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4b5563"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="500" y="430" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="bold">
    Detailed logs for your team. Generic messages for users. Never leak sensitive information.
  </text>
</svg>
