<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Input Validation: Whitelist, Not Sanitization
  </text>
  
  <!-- LEFT SIDE: Malicious Input -->
  <text x="150" y="70" font-size="14" font-weight="bold" fill="#991b1b">
    Malicious Input
  </text>
  
  <rect x="50" y="90" width="200" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
  <text x="150" y="110" font-size="12" text-anchor="middle" fill="#7f1d1d">1' OR '1'='1</text>
  <text x="150" y="130" font-size="12" text-anchor="middle" fill="#7f1d1d">(SQL Injection)</text>
  
  <rect x="50" y="170" width="200" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
  <text x="150" y="190" font-size="12" text-anchor="middle" fill="#7f1d1d">&lt;script&gt;alert()&lt;/script&gt;</text>
  <text x="150" y="210" font-size="12" text-anchor="middle" fill="#7f1d1d">(XSS)</text>
  
  <rect x="50" y="250" width="200" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
  <text x="150" y="270" font-size="12" text-anchor="middle" fill="#7f1d1d">../../../etc/passwd</text>
  <text x="150" y="290" font-size="12" text-anchor="middle" fill="#7f1d1d">(Path Traversal)</text>
  
  <!-- CENTER: Whitelist Filter -->
  <g>
    <!-- Filter box -->
    <rect x="330" y="100" width="140" height="210" fill="#e0e7ff" stroke="#4338ca" stroke-width="3" rx="4"/>
    
    <!-- Filter label -->
    <text x="400" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">
      WHITELIST
    </text>
    <text x="400" y="150" font-size="11" text-anchor="middle" fill="#3730a3">
      Filter
    </text>
    
    <!-- Valid patterns -->
    <text x="400" y="180" font-size="10" text-anchor="middle" fill="#4338ca">
      • Digits 0-9
    </text>
    <text x="400" y="195" font-size="10" text-anchor="middle" fill="#4338ca">
      • A-Za-z
    </text>
    <text x="400" y="210" font-size="10" text-anchor="middle" fill="#4338ca">
      • Length limit
    </text>
    <text x="400" y="225" font-size="10" text-anchor="middle" fill="#4338ca">
      • Expected format
    </text>
    <text x="400" y="240" font-size="10" text-anchor="middle" fill="#4338ca">
      • REJECT ALL else
    </text>
  </g>
  
  <!-- Arrows from left to filter -->
  <path d="M 250 120 Q 290 110 330 120" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
  <path d="M 250 200 Q 290 200 330 200" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
  <path d="M 250 280 Q 290 290 330 280" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
  
  <!-- RIGHT SIDE: Valid Input Only -->
  <text x="800" y="70" font-size="14" font-weight="bold" fill="#15803d">
    Valid Input Only
  </text>
  
  <rect x="700" y="90" width="200" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="800" y="115" font-size="12" text-anchor="middle" fill="#166534">
    "12345"
  </text>
  <text x="800" y="135" font-size="12" text-anchor="middle" fill="#166534">
    ✓ Matches pattern
  </text>
  
  <rect x="700" y="170" width="200" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="800" y="190" font-size="12" text-anchor="middle" fill="#166534">
    "john_doe"
  </text>
  <text x="800" y="210" font-size="12" text-anchor="middle" fill="#166534">
    ✓ Whitelist approved
  </text>
  
  <rect x="700" y="250" width="200" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="800" y="270" font-size="12" text-anchor="middle" fill="#166534">
    "2024-05-08"
  </text>
  <text x="800" y="290" font-size="12" text-anchor="middle" fill="#166534">
    ✓ Valid format
  </text>
  
  <!-- Arrows from filter to right -->
  <path d="M 470 120 Q 510 110 700 120" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
  <path d="M 470 200 Q 510 200 700 200" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
  <path d="M 470 280 Q 510 290 700 280" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="500" y="380" font-size="12" text-anchor="middle" fill="#4a5568" font-style="italic">
    Whitelist: "Only these formats are valid. Everything else is rejected."
  </text>
</svg>
