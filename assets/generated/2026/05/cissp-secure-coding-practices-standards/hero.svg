<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Secure Coding Practices
  </text>
  <text x="600" y="70" font-size="16" text-anchor="middle" fill="#4a5568">
    Discipline that prevents vulnerabilities
  </text>
  
  <!-- Center circle -->
  <circle cx="600" cy="380" r="80" fill="#e6f2ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Secure
  </text>
  <text x="600" y="405" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Code
  </text>
  
  <!-- 1. Input Validation (top left) -->
  <circle cx="250" cy="200" r="60" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/>
  <text x="250" y="205" font-size="12" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Input</text>
  <text x="250" y="220" font-size="12" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Validation</text>
  <line x1="250" y1="260" x2="350" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="285" font-size="11" fill="#1e40af">Whitelist</text>
  
  <!-- 2. Error Handling (top right) -->
  <circle cx="950" cy="200" r="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="950" y="200" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">Error</text>
  <text x="950" y="220" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">Handling</text>
  <line x1="900" y1="260" x2="750" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="870" y="285" font-size="11" fill="#166534">Generic Response</text>
  
  <!-- 3. Output Encoding (left) -->
  <circle cx="150" cy="380" r="60" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="150" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#831843">Output</text>
  <text x="150" y="400" font-size="12" font-weight="bold" text-anchor="middle" fill="#831843">Encoding</text>
  <line x1="210" y1="380" x2="520" y2="380" stroke="#db2777" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="370" font-size="11" fill="#9d174d">Context-aware</text>
  
  <!-- 4. Authorization (right) -->
  <circle cx="1050" cy="380" r="60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1050" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Authorization</text>
  <text x="1050" y="400" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Checks</text>
  <line x1="990" y1="380" x2="680" y2="380" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="820" y="370" font-size="11" fill="#b45309">Everywhere</text>
  
  <!-- 5. Dependencies (bottom left) -->
  <circle cx="280" cy="550" r="60" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="280" y="545" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Dependency</text>
  <text x="280" y="565" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Management</text>
  <line x1="330" y1="510" x2="450" y2="430" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380" y="460" font-size="11" fill="#6d28d9">Keep Updated</text>
  
  <!-- 6. Logging (bottom right) -->
  <circle cx="920" cy="550" r="60" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="920" y="550" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b21a8">Secure</text>
  <text x="920" y="570" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b21a8">Logging</text>
  <line x1="870" y1="510" x2="750" y2="430" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="790" y="460" font-size="11" fill="#7e22ce">No Secrets</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a365d"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="600" y="665" font-size="13" text-anchor="middle" fill="#4a5568">
    Discipline built into how developers think about every piece of code
  </text>
</svg>
