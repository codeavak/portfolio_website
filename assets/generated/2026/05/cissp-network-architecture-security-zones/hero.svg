<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="940" height="540" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="470" y="38" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="700" letter-spacing="0.5">Network Security Zones — Trust Architecture</text>
  <text x="470" y="58" text-anchor="middle" fill="#64748b" font-size="11">Trust decreases as you move left. Control intensity increases at every boundary.</text>

  <!-- ── INTERNET ── -->
  <rect x="18" y="76" width="130" height="380" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="83" y="100" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">INTERNET</text>
  <text x="83" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">Untrusted</text>
  <rect x="33" y="130" width="100" height="28" rx="4" fill="#280d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="83" y="149" text-anchor="middle" fill="#fca5a5" font-size="10">Public Users</text>
  <rect x="33" y="167" width="100" height="28" rx="4" fill="#280d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="83" y="186" text-anchor="middle" fill="#fca5a5" font-size="10">Threat Actors</text>
  <rect x="33" y="204" width="100" height="28" rx="4" fill="#280d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="83" y="223" text-anchor="middle" fill="#fca5a5" font-size="10">Partners / APIs</text>
  <text x="83" y="270" text-anchor="middle" fill="#475569" font-size="9">No trust</text>
  <text x="83" y="283" text-anchor="middle" fill="#475569" font-size="9">assumed</text>

  <!-- ── EXTERIOR FIREWALL ── -->
  <rect x="162" y="108" width="58" height="316" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="191" y="148" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">EXT</text>
  <text x="191" y="161" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">FIREWALL</text>
  <line x1="191" y1="172" x2="191" y2="174" stroke="#f59e0b" stroke-width="1"/>
  <text x="191" y="190" text-anchor="middle" fill="#94a3b8" font-size="8">Packet filter</text>
  <text x="191" y="204" text-anchor="middle" fill="#94a3b8" font-size="8">Stateful</text>
  <text x="191" y="218" text-anchor="middle" fill="#94a3b8" font-size="8">ACL rules</text>
  <text x="191" y="232" text-anchor="middle" fill="#94a3b8" font-size="8">DDoS scrub</text>
  <!-- shield glyph -->
  <path d="M191,260 l-12,8 v22 l12,14 l12,-14 v-22 Z" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1"/>

  <!-- ── DMZ ── -->
  <rect x="234" y="76" width="130" height="380" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="299" y="100" text-anchor="middle" fill="#f97316" font-size="12" font-weight="700">DMZ</text>
  <text x="299" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">Semi-trusted</text>
  <rect x="249" y="130" width="100" height="28" rx="4" fill="#2a1500" stroke="#f97316" stroke-width="1"/>
  <text x="299" y="149" text-anchor="middle" fill="#fed7aa" font-size="10">Web Server</text>
  <rect x="249" y="167" width="100" height="28" rx="4" fill="#2a1500" stroke="#f97316" stroke-width="1"/>
  <text x="299" y="186" text-anchor="middle" fill="#fed7aa" font-size="10">Reverse Proxy</text>
  <rect x="249" y="204" width="100" height="28" rx="4" fill="#2a1500" stroke="#f97316" stroke-width="1"/>
  <text x="299" y="223" text-anchor="middle" fill="#fed7aa" font-size="10">Email Gateway</text>
  <rect x="249" y="241" width="100" height="28" rx="4" fill="#2a1500" stroke="#f97316" stroke-width="1"/>
  <text x="299" y="260" text-anchor="middle" fill="#fed7aa" font-size="10">DNS (public)</text>
  <text x="299" y="310" text-anchor="middle" fill="#475569" font-size="9">Reachable from</text>
  <text x="299" y="323" text-anchor="middle" fill="#475569" font-size="9">internet. No direct</text>
  <text x="299" y="336" text-anchor="middle" fill="#475569" font-size="9">path to internal.</text>

  <!-- ── INTERIOR FIREWALL ── -->
  <rect x="378" y="108" width="58" height="316" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="407" y="148" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">INT</text>
  <text x="407" y="161" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">FIREWALL</text>
  <text x="407" y="190" text-anchor="middle" fill="#94a3b8" font-size="8">NGFW / IPS</text>
  <text x="407" y="204" text-anchor="middle" fill="#94a3b8" font-size="8">TLS inspect</text>
  <text x="407" y="218" text-anchor="middle" fill="#94a3b8" font-size="8">App proxy</text>
  <text x="407" y="232" text-anchor="middle" fill="#94a3b8" font-size="8">DLP</text>
  <path d="M407,260 l-12,8 v22 l12,14 l12,-14 v-22 Z" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1"/>

  <!-- ── INTERNAL ── -->
  <rect x="450" y="76" width="120" height="380" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="510" y="100" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">INTERNAL</text>
  <text x="510" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">Trusted</text>
  <rect x="463" y="130" width="94" height="28" rx="4" fill="#0a1f10" stroke="#22c55e" stroke-width="1"/>
  <text x="510" y="149" text-anchor="middle" fill="#86efac" font-size="10">Workstations</text>
  <rect x="463" y="167" width="94" height="28" rx="4" fill="#0a1f10" stroke="#22c55e" stroke-width="1"/>
  <text x="510" y="186" text-anchor="middle" fill="#86efac" font-size="10">File Servers</text>
  <rect x="463" y="204" width="94" height="28" rx="4" fill="#0a1f10" stroke="#22c55e" stroke-width="1"/>
  <text x="510" y="223" text-anchor="middle" fill="#86efac" font-size="10">Shared Apps</text>
  <rect x="463" y="241" width="94" height="28" rx="4" fill="#0a1f10" stroke="#22c55e" stroke-width="1"/>
  <text x="510" y="260" text-anchor="middle" fill="#86efac" font-size="10">Printers / AD</text>

  <!-- ── RESTRICTED (segmented from internal via ACL/micro) ── -->
  <rect x="585" y="76" width="120" height="380" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="645" y="100" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">RESTRICTED</text>
  <text x="645" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">High-trust</text>
  <rect x="598" y="130" width="94" height="28" rx="4" fill="#130d2a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="645" y="149" text-anchor="middle" fill="#c4b5fd" font-size="10">Databases</text>
  <rect x="598" y="167" width="94" height="28" rx="4" fill="#130d2a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="645" y="186" text-anchor="middle" fill="#c4b5fd" font-size="10">Finance / HR</text>
  <rect x="598" y="204" width="94" height="28" rx="4" fill="#130d2a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="645" y="223" text-anchor="middle" fill="#c4b5fd" font-size="10">Core Services</text>
  <rect x="598" y="241" width="94" height="28" rx="4" fill="#130d2a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="645" y="260" text-anchor="middle" fill="#c4b5fd" font-size="10">Secrets / PKI</text>

  <!-- ── MANAGEMENT ── -->
  <rect x="720" y="76" width="130" height="380" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="785" y="100" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="700">MANAGEMENT</text>
  <text x="785" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">Out-of-band</text>
  <rect x="733" y="130" width="104" height="28" rx="4" fill="#1f0818" stroke="#ec4899" stroke-width="1"/>
  <text x="785" y="149" text-anchor="middle" fill="#f9a8d4" font-size="10">Jump Server / PAW</text>
  <rect x="733" y="167" width="104" height="28" rx="4" fill="#1f0818" stroke="#ec4899" stroke-width="1"/>
  <text x="785" y="186" text-anchor="middle" fill="#f9a8d4" font-size="10">SIEM / Log Mgmt</text>
  <rect x="733" y="204" width="104" height="28" rx="4" fill="#1f0818" stroke="#ec4899" stroke-width="1"/>
  <text x="785" y="223" text-anchor="middle" fill="#f9a8d4" font-size="10">Network Devices</text>
  <rect x="733" y="241" width="104" height="28" rx="4" fill="#1f0818" stroke="#ec4899" stroke-width="1"/>
  <text x="785" y="260" text-anchor="middle" fill="#f9a8d4" font-size="10">Firewall Mgmt</text>
  <text x="785" y="310" text-anchor="middle" fill="#475569" font-size="9">MFA required.</text>
  <text x="785" y="323" text-anchor="middle" fill="#475569" font-size="9">Dedicated VLAN.</text>
  <text x="785" y="336" text-anchor="middle" fill="#475569" font-size="9">No data-plane mix.</text>

  <!-- ── FLOW ARROWS ── -->
  <!-- Internet → Ext FW -->
  <line x1="148" y1="268" x2="162" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Ext FW → DMZ -->
  <line x1="220" y1="268" x2="234" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DMZ → Int FW -->
  <line x1="364" y1="268" x2="378" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Int FW → Internal -->
  <line x1="436" y1="268" x2="450" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Internal → Restricted (dashed = ACL/RBAC) -->
  <line x1="570" y1="268" x2="585" y2="268" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="18" y="478" width="904" height="46" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="497" x2="70" y2="497" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="70,497 64,493 64,501" fill="#64748b"/>
  <text x="76" y="501" fill="#94a3b8" font-size="10">Firewall-enforced boundary</text>
  <line x1="260" y1="497" x2="290" y2="497" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="290,497 284,493 284,501" fill="#64748b"/>
  <text x="296" y="501" fill="#94a3b8" font-size="10">ACL / RBAC boundary</text>
  <circle cx="470" cy="497" r="5" fill="#ec4899" opacity="0.6"/>
  <text x="480" y="501" fill="#94a3b8" font-size="10">Management zone: completely separate, no lateral path to/from data zones</text>
  <text x="470" y="516" text-anchor="middle" fill="#334155" font-size="9">Default posture: deny-all, permit-by-exception at every boundary</text>
</svg>
