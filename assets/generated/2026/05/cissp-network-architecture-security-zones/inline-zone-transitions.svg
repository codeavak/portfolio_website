<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgzt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="ztarrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="860" height="460" fill="url(#bgzt)" rx="14"/>
  <text x="430" y="36" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Zone Transition Controls — What Enforces the Boundary</text>
  <text x="430" y="54" text-anchor="middle" fill="#64748b" font-size="11">Every zone boundary is a policy decision. No implicit trust between zones.</text>

  <!-- ── ROW 1: Internet → DMZ ── -->
  <!-- Internet box -->
  <rect x="18" y="80" width="130" height="72" rx="6" fill="#280d0d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="83" y="102" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">INTERNET</text>
  <text x="83" y="120" text-anchor="middle" fill="#94a3b8" font-size="9">Any source</text>
  <text x="83" y="135" text-anchor="middle" fill="#94a3b8" font-size="9">No trust</text>

  <!-- Arrow -->
  <line x1="148" y1="116" x2="220" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#ztarrow)"/>

  <!-- Control box -->
  <rect x="220" y="80" width="200" height="72" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">Exterior Firewall</text>
  <text x="320" y="117" text-anchor="middle" fill="#94a3b8" font-size="9">Packet filter + stateful inspection</text>
  <text x="320" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">DDoS scrubbing · deny-all inbound default</text>
  <text x="320" y="145" text-anchor="middle" fill="#94a3b8" font-size="9">Only ports 80/443 (and declared services) open</text>

  <!-- Arrow -->
  <line x1="420" y1="116" x2="490" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#ztarrow)"/>

  <!-- DMZ box -->
  <rect x="490" y="80" width="130" height="72" rx="6" fill="#2a1500" stroke="#f97316" stroke-width="1.5"/>
  <text x="555" y="102" text-anchor="middle" fill="#f97316" font-size="11" font-weight="700">DMZ</text>
  <text x="555" y="120" text-anchor="middle" fill="#94a3b8" font-size="9">Web · Proxy</text>
  <text x="555" y="135" text-anchor="middle" fill="#94a3b8" font-size="9">Email · DNS</text>

  <!-- Key insight -->
  <rect x="640" y="86" width="202" height="60" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="741" y="104" text-anchor="middle" fill="#6b7280" font-size="9" font-weight="600">KEY PRINCIPLE</text>
  <text x="741" y="120" text-anchor="middle" fill="#d1d5db" font-size="9">DMZ hosts should never</text>
  <text x="741" y="134" text-anchor="middle" fill="#d1d5db" font-size="9">initiate connections to internal.</text>

  <!-- ── ROW 2: DMZ → Internal ── -->
  <rect x="18" y="190" width="130" height="72" rx="6" fill="#2a1500" stroke="#f97316" stroke-width="1.5"/>
  <text x="83" y="212" text-anchor="middle" fill="#f97316" font-size="11" font-weight="700">DMZ</text>
  <text x="83" y="230" text-anchor="middle" fill="#94a3b8" font-size="9">Semi-trusted</text>
  <text x="83" y="245" text-anchor="middle" fill="#94a3b8" font-size="9">externally facing</text>

  <line x1="148" y1="226" x2="220" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#ztarrow)"/>

  <rect x="220" y="190" width="200" height="72" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="210" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">Interior Firewall + IPS</text>
  <text x="320" y="227" text-anchor="middle" fill="#94a3b8" font-size="9">NGFW with Layer 7 inspection</text>
  <text x="320" y="241" text-anchor="middle" fill="#94a3b8" font-size="9">Application proxy · TLS decryption</text>
  <text x="320" y="255" text-anchor="middle" fill="#94a3b8" font-size="9">DLP · IPS signature matching</text>

  <line x1="420" y1="226" x2="490" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#ztarrow)"/>

  <rect x="490" y="190" width="130" height="72" rx="6" fill="#0a1f10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="555" y="212" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">INTERNAL</text>
  <text x="555" y="230" text-anchor="middle" fill="#94a3b8" font-size="9">Workstations</text>
  <text x="555" y="245" text-anchor="middle" fill="#94a3b8" font-size="9">Shared services</text>

  <rect x="640" y="196" width="202" height="60" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="741" y="214" text-anchor="middle" fill="#6b7280" font-size="9" font-weight="600">KEY PRINCIPLE</text>
  <text x="741" y="230" text-anchor="middle" fill="#d1d5db" font-size="9">Interior FW is the critical control.</text>
  <text x="741" y="244" text-anchor="middle" fill="#d1d5db" font-size="9">One-firewall DMZ = no protection.</text>

  <!-- ── ROW 3: Internal → Restricted ── -->
  <rect x="18" y="300" width="130" height="72" rx="6" fill="#0a1f10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="83" y="322" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">INTERNAL</text>
  <text x="83" y="340" text-anchor="middle" fill="#94a3b8" font-size="9">Standard users</text>
  <text x="83" y="355" text-anchor="middle" fill="#94a3b8" font-size="9">and services</text>

  <line x1="148" y1="336" x2="220" y2="336" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ztarrow)"/>

  <rect x="220" y="300" width="200" height="72" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="320" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">ACL + RBAC + Micro-seg</text>
  <text x="320" y="337" text-anchor="middle" fill="#94a3b8" font-size="9">Router/switch ACLs at Layer 3/4</text>
  <text x="320" y="351" text-anchor="middle" fill="#94a3b8" font-size="9">Role-based access to sensitive systems</text>
  <text x="320" y="365" text-anchor="middle" fill="#94a3b8" font-size="9">Microsegmentation where deployed</text>

  <line x1="420" y1="336" x2="490" y2="336" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ztarrow)"/>

  <rect x="490" y="300" width="130" height="72" rx="6" fill="#130d2a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="555" y="322" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">RESTRICTED</text>
  <text x="555" y="340" text-anchor="middle" fill="#94a3b8" font-size="9">Databases</text>
  <text x="555" y="355" text-anchor="middle" fill="#94a3b8" font-size="9">Finance / PII</text>

  <rect x="640" y="306" width="202" height="60" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="741" y="324" text-anchor="middle" fill="#6b7280" font-size="9" font-weight="600">KEY PRINCIPLE</text>
  <text x="741" y="340" text-anchor="middle" fill="#d1d5db" font-size="9">ACLs are coarse. Not stateful.</text>
  <text x="741" y="354" text-anchor="middle" fill="#d1d5db" font-size="9">Supplement with identity-aware controls.</text>

  <!-- ── NAT caveat ── -->
  <rect x="18" y="400" width="824" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="40" y="418" fill="#f59e0b" font-size="10" font-weight="700">NAT ≠ Security: </text>
  <text x="135" y="418" fill="#94a3b8" font-size="10">NAT obscures internal IPs but provides no access control. A compromised DMZ host can still reach internal resources if firewall rules allow it.</text>
  <text x="40" y="434" fill="#94a3b8" font-size="10">CISSP expects you to know NAT is an addressing mechanism, not a substitute for firewall policy.</text>
</svg>
