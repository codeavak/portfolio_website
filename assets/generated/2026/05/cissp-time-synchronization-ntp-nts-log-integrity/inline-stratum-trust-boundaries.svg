<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">NTP Stratum Trust Boundaries</title>
  <desc id="desc">Diagram showing trusted source tiers and trust boundary controls for enterprise time synchronization.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="url(#bg2)"/>
  <text x="70" y="70" fill="#f9fafb" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Time Trust Boundaries</text>
  <text x="70" y="110" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Only approved sources should feed critical systems</text>

  <rect x="70" y="170" width="360" height="140" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="220" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">External Sources</text>
  <text x="95" y="258" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="22">Multiple providers</text>
  <text x="95" y="288" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="22">NTS preferred</text>

  <rect x="520" y="170" width="360" height="140" rx="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
  <text x="545" y="220" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Authoritative Tier</text>
  <text x="545" y="258" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Stratum 1/2 servers</text>
  <text x="545" y="288" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Policy controlled</text>

  <rect x="970" y="170" width="360" height="140" rx="14" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="995" y="220" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Consumers</text>
  <text x="995" y="258" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Identity, PKI, SIEM</text>
  <text x="995" y="288" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Business transactions</text>

  <line x1="430" y1="240" x2="520" y2="240" stroke="#93c5fd" stroke-width="5" marker-end="url(#arr2)"/>
  <line x1="880" y1="240" x2="970" y2="240" stroke="#93c5fd" stroke-width="5" marker-end="url(#arr2)"/>

  <rect x="70" y="370" width="1260" height="320" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="100" y="425" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Control Expectations</text>

  <text x="110" y="485" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">1. Enforce approved source allowlists</text>
  <text x="110" y="535" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">2. Segment time distribution by trust zone</text>
  <text x="110" y="585" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">3. Monitor offset, jitter, and source flaps</text>
  <text x="110" y="635" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">4. Test incident runbooks for drift and spoofing scenarios</text>

  <text x="860" y="485" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Security outcome:</text>
  <text x="860" y="530" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Reliable authentication windows</text>
  <text x="860" y="570" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Consistent certificate validation</text>
  <text x="860" y="610" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Defensible event timelines</text>
</svg>
