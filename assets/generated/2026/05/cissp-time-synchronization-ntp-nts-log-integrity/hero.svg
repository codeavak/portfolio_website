<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CISSP 70 Time Synchronization Security</title>
  <desc id="desc">Architecture diagram showing trusted external time sources, internal NTP tiers, NTS-protected sync, and dependent security systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243b67"/>
      <stop offset="100%" stop-color="#1b2f52"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">CISSP #70: Trusted Time Architecture</text>
  <text x="80" y="135" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="28">NTP + NTS + Monitoring + Incident Response</text>

  <rect x="80" y="210" width="420" height="190" rx="18" fill="url(#panel)" stroke="#60a5fa" stroke-width="2"/>
  <text x="110" y="255" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">External Trusted Sources</text>
  <text x="110" y="300" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Source A (GNSS-backed)</text>
  <text x="110" y="335" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Source B (Provider 2)</text>
  <text x="110" y="370" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">NTS certificates validated</text>

  <rect x="590" y="210" width="420" height="190" rx="18" fill="url(#panel)" stroke="#22d3ee" stroke-width="2"/>
  <text x="620" y="255" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Internal Authoritative Tier</text>
  <text x="620" y="300" fill="#cffafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Stratum 1/2 servers</text>
  <text x="620" y="335" fill="#cffafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Strict source policy</text>
  <text x="620" y="370" fill="#cffafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Offset + jitter monitoring</text>

  <rect x="1100" y="210" width="420" height="190" rx="18" fill="url(#panel)" stroke="#34d399" stroke-width="2"/>
  <text x="1130" y="255" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Critical Security Consumers</text>
  <text x="1130" y="300" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">Identity and Kerberos</text>
  <text x="1130" y="335" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">PKI and TLS validation</text>
  <text x="1130" y="370" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">SIEM and forensics timeline</text>

  <line x1="500" y1="305" x2="590" y2="305" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1010" y1="305" x2="1100" y2="305" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="80" y="470" width="1440" height="280" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="115" y="525" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Operational Security Layer</text>

  <circle cx="180" cy="620" r="18" fill="#38bdf8"/>
  <text x="220" y="628" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Alert on drift and source instability</text>

  <circle cx="180" cy="675" r="18" fill="#38bdf8"/>
  <text x="220" y="683" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Block unapproved upstream time paths</text>

  <circle cx="850" cy="620" r="18" fill="#34d399"/>
  <text x="890" y="628" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Prioritize re-sync of identity and logging platforms</text>

  <circle cx="850" cy="675" r="18" fill="#34d399"/>
  <text x="890" y="683" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Restore timeline confidence for incident response</text>
</svg>
