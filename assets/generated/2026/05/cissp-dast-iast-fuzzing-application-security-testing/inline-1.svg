<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Comparison of SAST, DAST, and IAST showing when each runs in the SDLC and what each observes">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3048;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg1)"/>

  <!-- Title -->
  <text x="450" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#e0eaf5" text-anchor="middle">SAST vs DAST vs IAST: Where Each Method Fits</text>
  <text x="450" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8ab0cc" text-anchor="middle">Each testing method covers a different layer of the SDLC</text>

  <!-- Column headers -->
  <text x="110" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#9cb8cc" text-anchor="middle">Attribute</text>
  <text x="300" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#7ec8e3" text-anchor="middle">SAST</text>
  <text x="500" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f0c040" text-anchor="middle">DAST</text>
  <text x="720" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#a8d8a8" text-anchor="middle">IAST</text>

  <!-- Header underline -->
  <line x1="30" y1="106" x2="870" y2="106" stroke="#2e4a6a" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="200" y1="106" x2="200" y2="390" stroke="#2e4a6a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="106" x2="400" y2="390" stroke="#2e4a6a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="610" y1="106" x2="610" y2="390" stroke="#2e4a6a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Row 1: Needs source code? -->
  <rect x="30" y="108" width="840" height="44" rx="0" fill="#11263a" opacity="0.5"/>
  <text x="110" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">Source code</text>
  <text x="110" y="149" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">required?</text>
  <text x="300" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle">✓ Yes</text>
  <text x="500" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e07070" text-anchor="middle">✗ No</text>
  <text x="720" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e07070" text-anchor="middle">✗ No</text>

  <!-- Row 2: Needs running app? -->
  <rect x="30" y="152" width="840" height="44" rx="0" fill="#0d1f30" opacity="0.5"/>
  <text x="110" y="179" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">Running app</text>
  <text x="110" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">required?</text>
  <text x="300" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e07070" text-anchor="middle">✗ No</text>
  <text x="500" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle">✓ Yes</text>
  <text x="720" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle">✓ Yes + agent</text>

  <!-- Row 3: SDLC phase -->
  <rect x="30" y="196" width="840" height="44" rx="0" fill="#11263a" opacity="0.5"/>
  <text x="110" y="223" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">Best SDLC</text>
  <text x="110" y="237" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">phase</text>
  <text x="300" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7ec8e3" text-anchor="middle">Build / pre-commit</text>
  <text x="500" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c040" text-anchor="middle">Staging / pre-prod</text>
  <text x="720" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a8d8a8" text-anchor="middle">Integration testing</text>

  <!-- Row 4: Perspective -->
  <rect x="30" y="240" width="840" height="44" rx="0" fill="#0d1f30" opacity="0.5"/>
  <text x="110" y="267" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">Testing</text>
  <text x="110" y="281" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">perspective</text>
  <text x="300" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7ec8e3" text-anchor="middle">White-box (code)</text>
  <text x="500" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c040" text-anchor="middle">Black-box (external)</text>
  <text x="720" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a8d8a8" text-anchor="middle">Gray-box (hybrid)</text>

  <!-- Row 5: Finds -->
  <rect x="30" y="284" width="840" height="56" rx="0" fill="#11263a" opacity="0.5"/>
  <text x="110" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9cb8cc" text-anchor="middle">What it finds</text>
  <text x="300" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c5dff0" text-anchor="middle">Insecure code patterns,</text>
  <text x="300" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c5dff0" text-anchor="middle">hardcoded secrets,</text>
  <text x="300" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c5dff0" text-anchor="middle">risky function calls</text>
  <text x="500" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f5e0a0" text-anchor="middle">Runtime auth/session flaws,</text>
  <text x="500" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f5e0a0" text-anchor="middle">injection in deployed state,</text>
  <text x="500" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f5e0a0" text-anchor="middle">misconfigurations</text>
  <text x="720" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c8eac8" text-anchor="middle">Runtime vulns with code</text>
  <text x="720" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c8eac8" text-anchor="middle">context; fewer false</text>
  <text x="720" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c8eac8" text-anchor="middle">positives</text>

  <!-- Bottom rule -->
  <line x1="30" y1="342" x2="870" y2="342" stroke="#2e4a6a" stroke-width="1"/>

  <!-- Bottom note -->
  <text x="450" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6a8fa8" text-anchor="middle">No single method is sufficient — gaps between methods are where vulnerabilities tend to hide</text>
  <text x="450" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6a8fa8" text-anchor="middle">CISSP Domain 8 — Software Development Security</text>
</svg>
