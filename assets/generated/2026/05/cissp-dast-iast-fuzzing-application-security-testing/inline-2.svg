<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Fuzzing pipeline showing input generation flowing to target application and anomaly detection">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3048;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1e4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e1538;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162c38;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="anomalyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1010;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8ab0cc"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e07830"/>
    </marker>
    <marker id="arrowFeedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a060c0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bgF)"/>

  <!-- Title -->
  <text x="450" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#e0eaf5" text-anchor="middle">Fuzzing Pipeline</text>
  <text x="450" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8ab0cc" text-anchor="middle">Coverage-guided fuzzing probes input boundaries to find crashes and unexpected behavior</text>

  <!-- Box 1: Input Generator -->
  <rect x="40" y="90" width="210" height="220" rx="10" fill="url(#genGrad)" stroke="#7a50c0" stroke-width="2"/>
  <text x="145" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0a0e8" text-anchor="middle">Input Generator</text>
  <line x1="60" y1="128" x2="230" y2="128" stroke="#7a50c0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="65" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d0c0f0">▸ Random mutation</text>
  <text x="65" y="173" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d0c0f0">▸ Boundary values</text>
  <text x="65" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d0c0f0">▸ Malformed structures</text>
  <text x="65" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d0c0f0">▸ Oversized inputs</text>
  <text x="65" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d0c0f0">▸ Invalid encodings</text>
  <text x="65" y="257" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d0c0f0">▸ Unexpected types</text>

  <rect x="60" y="272" width="170" height="24" rx="5" fill="#1a0e2e"/>
  <text x="145" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c0a0e8" text-anchor="middle">AFL / libFuzzer / custom</text>

  <!-- Arrow 1 -->
  <line x1="252" y1="200" x2="330" y2="200" stroke="#8ab0cc" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <text x="291" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8ab0cc" text-anchor="middle">inputs</text>

  <!-- Box 2: Target Application -->
  <rect x="332" y="90" width="236" height="220" rx="10" fill="url(#targetGrad)" stroke="#3080a0" stroke-width="2"/>
  <text x="450" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#7ec8e3" text-anchor="middle">Target Application</text>
  <line x1="352" y1="128" x2="548" y2="128" stroke="#3080a0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="357" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#c0dce8">Well-suited targets:</text>
  <text x="357" y="173" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9ecce0">▸ File parsers (PDF, XML…)</text>
  <text x="357" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9ecce0">▸ Network protocol handlers</text>
  <text x="357" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9ecce0">▸ API endpoints</text>
  <text x="357" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9ecce0">▸ Serialization handlers</text>
  <text x="357" y="257" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9ecce0">▸ Image / media decoders</text>

  <rect x="352" y="272" width="196" height="24" rx="5" fill="#0e1e2a"/>
  <text x="450" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7ec8e3" text-anchor="middle">Instrumented for code coverage</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="200" x2="648" y2="200" stroke="#e07830" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="609" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e07830" text-anchor="middle">behavior</text>

  <!-- Box 3: Anomaly Detector -->
  <rect x="650" y="90" width="210" height="220" rx="10" fill="url(#anomalyGrad)" stroke="#c04040" stroke-width="2"/>
  <text x="755" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f08080" text-anchor="middle">Anomaly Detector</text>
  <line x1="670" y1="128" x2="840" y2="128" stroke="#c04040" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="675" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c0c0">Detects:</text>
  <text x="675" y="171" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c0c0">▸ Crashes / segfaults</text>
  <text x="675" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c0c0">▸ Hangs / timeouts</text>
  <text x="675" y="213" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c0c0">▸ Memory violations</text>
  <text x="675" y="234" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c0c0">▸ Unhandled exceptions</text>
  <text x="675" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f0c0c0">▸ Assertion failures</text>

  <rect x="670" y="272" width="170" height="24" rx="5" fill="#200a0a"/>
  <text x="755" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f08080" text-anchor="middle">Logs crashing inputs</text>

  <!-- Coverage feedback arrow (curved bottom) -->
  <path d="M 755 312 Q 755 360 450 360 Q 145 360 145 312" stroke="#a060c0" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowFeedback)"/>
  <text x="450" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a060c0" text-anchor="middle">Coverage feedback guides next input generation (coverage-guided fuzzing)</text>

  <!-- Bottom note -->
  <text x="450" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6a8fa8" text-anchor="middle">CISSP Domain 8 — Software Development Security</text>
</svg>
