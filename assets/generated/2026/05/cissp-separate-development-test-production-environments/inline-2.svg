<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-label="Release path across development, test, staging, and production with separate data and approval controls">
  <rect width="920" height="320" rx="12" fill="#0f172a"/>
  <text x="460" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#f8fafc">Release Confidence Without Reusing Production Trust</text>

  <rect x="34" y="84" width="182" height="92" rx="10" fill="#13263f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="125" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#bfdbfe">Development</text>
  <text x="125" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dbeafe">fast change</text>
  <text x="125" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dbeafe">synthetic data</text>

  <line x1="216" y1="130" x2="258" y2="130" stroke="#475569" stroke-width="3"/>
  <polygon points="258,130 246,124 246,136" fill="#475569"/>

  <rect x="258" y="84" width="182" height="92" rx="10" fill="#1b2434" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="349" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fde68a">Test</text>
  <text x="349" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7">masked subsets</text>
  <text x="349" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7">controlled exceptions</text>

  <line x1="440" y1="130" x2="482" y2="130" stroke="#475569" stroke-width="3"/>
  <polygon points="482,130 470,124 470,136" fill="#475569"/>

  <rect x="482" y="84" width="182" height="92" rx="10" fill="#10281e" stroke="#34d399" stroke-width="1.5"/>
  <text x="573" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#86efac">Staging</text>
  <text x="573" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dcfce7">prod-like behavior</text>
  <text x="573" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dcfce7">separate secrets</text>

  <line x1="664" y1="130" x2="706" y2="130" stroke="#475569" stroke-width="3"/>
  <polygon points="706,130 694,124 694,136" fill="#475569"/>

  <rect x="706" y="72" width="180" height="116" rx="10" fill="#2a1b10" stroke="#fb923c" stroke-width="1.7"/>
  <text x="796" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fdba74">Production</text>
  <text x="796" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffedd5">tightest approvals</text>
  <text x="796" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffedd5">strongest audit trail</text>
  <text x="796" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffedd5">real user data</text>

  <rect x="66" y="220" width="788" height="62" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="460" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Good parity means similar behavior, not shared trust boundaries.</text>
  <text x="460" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Code moves forward. Production-only data, credentials, and authority should not flow backward.</text>

  <text x="460" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">CISSP #55</text>
</svg>