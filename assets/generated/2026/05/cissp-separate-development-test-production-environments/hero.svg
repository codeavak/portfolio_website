<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Development, test, staging, and production separation with distinct trust and data controls">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="14" fill="url(#bg)"/>
  <text x="480" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#f8fafc">Development, Test, and Production Must Stay Separate</text>
  <text x="480" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">CISSP Domain 8 - Environment boundaries protect trust, data, and release discipline</text>

  <rect x="36" y="102" width="180" height="132" rx="12" fill="#13263f" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="126" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#bfdbfe">Development</text>
  <text x="126" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">Fast change</text>
  <text x="126" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">Synthetic data</text>
  <text x="126" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">Limited secrets</text>
  <text x="126" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">No prod trust</text>

  <rect x="246" y="102" width="180" height="132" rx="12" fill="#1b2434" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="336" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fde68a">Test</text>
  <text x="336" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">Controlled validation</text>
  <text x="336" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">Masked subsets</text>
  <text x="336" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">Separate accounts</text>
  <text x="336" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7">Audited exceptions</text>

  <rect x="456" y="102" width="180" height="132" rx="12" fill="#10281e" stroke="#34d399" stroke-width="1.6"/>
  <text x="546" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#86efac">Staging</text>
  <text x="546" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">Release confidence</text>
  <text x="546" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">Prod-like behavior</text>
  <text x="546" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">Distinct credentials</text>
  <text x="546" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dcfce7">Tighter approvals</text>

  <rect x="666" y="90" width="258" height="156" rx="12" fill="#2a1b10" stroke="#fb923c" stroke-width="1.8"/>
  <text x="795" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#fdba74">Production</text>
  <text x="795" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffedd5">Real users and transactions</text>
  <text x="795" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffedd5">Strongest access controls</text>
  <text x="795" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffedd5">Full auditability</text>
  <text x="795" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffedd5">Sensitive data stays here</text>

  <g stroke="#475569" stroke-width="2.5" fill="#475569">
    <line x1="216" y1="168" x2="246" y2="168"/>
    <polygon points="238,163 250,168 238,173"/>
    <line x1="426" y1="168" x2="456" y2="168"/>
    <polygon points="448,163 460,168 448,173"/>
    <line x1="636" y1="168" x2="666" y2="168"/>
    <polygon points="658,163 670,168 658,173"/>
  </g>

  <line x1="90" y1="292" x2="870" y2="292" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="480" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd">Trusted release path moves upward in control, not sideways in convenience</text>

  <rect x="100" y="318" width="760" height="48" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1"/>
  <text x="480" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#bae6fd">If lower environments inherit production data, secrets, and permissions, the boundary is mostly cosmetic.</text>

  <text x="480" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">CISSP #55</text>
</svg>