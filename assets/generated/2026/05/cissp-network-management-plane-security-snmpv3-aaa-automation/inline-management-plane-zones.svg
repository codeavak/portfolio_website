<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Management Plane Zones and Access Paths</title>
  <desc id="desc">Zoned architecture showing user network, bastion zone, and isolated management network with strict protocol controls.</desc>
  <defs>
    <linearGradient id="bgi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <marker id="arri" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="url(#bgi)"/>
  <text x="60" y="70" fill="#f9fafb" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Management Plane Zoning</text>
  <text x="60" y="108" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Privileged access should traverse controlled pathways only</text>

  <rect x="60" y="170" width="360" height="170" rx="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <text x="85" y="225" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">User/Admin Zone</text>
  <text x="85" y="265" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="22">Privileged workstation</text>
  <text x="85" y="298" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="22">No direct device admin</text>

  <rect x="520" y="170" width="360" height="170" rx="14" fill="#065f46" stroke="#6ee7b7" stroke-width="2"/>
  <text x="545" y="225" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Bastion/AAA Zone</text>
  <text x="545" y="265" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">MFA and session policy</text>
  <text x="545" y="298" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Command authorization</text>

  <rect x="980" y="170" width="360" height="170" rx="14" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
  <text x="1005" y="225" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Management Network</text>
  <text x="1005" y="265" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="22">SNMPv3, SSH, APIs</text>
  <text x="1005" y="298" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Routers, switches, firewalls</text>

  <line x1="420" y1="255" x2="520" y2="255" stroke="#93c5fd" stroke-width="5" marker-end="url(#arri)"/>
  <line x1="880" y1="255" x2="980" y2="255" stroke="#93c5fd" stroke-width="5" marker-end="url(#arri)"/>

  <rect x="60" y="390" width="1280" height="320" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="90" y="445" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Control Rules</text>

  <text x="100" y="500" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">1. Deny direct admin traffic from general segments</text>
  <text x="100" y="548" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">2. Require centralized AAA before device command execution</text>
  <text x="100" y="596" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">3. Restrict management protocols to approved sources and ports</text>
  <text x="100" y="644" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">4. Alert on drift, denied commands, and unusual admin login patterns</text>

  <text x="840" y="500" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Risk reduction:</text>
  <text x="840" y="538" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Reduced lateral movement options</text>
  <text x="840" y="574" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Stronger privileged accountability</text>
  <text x="840" y="610" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Faster compromise containment</text>
</svg>
