<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CISSP 73 Egress Filtering Security Boundary</title>
  <desc id="desc">Outbound security architecture showing controlled gateways, DNS and proxy policy, monitoring, and incident containment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="70" y="84" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">CISSP #73: Egress Filtering as Security Boundary</text>
  <text x="70" y="126" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="26">Constrain outbound paths to reduce command-and-control and exfiltration risk</text>

  <rect x="70" y="190" width="420" height="215" rx="16" fill="url(#cardA)" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="245" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Internal Segments</text>
  <text x="100" y="286" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">User and server tiers</text>
  <text x="100" y="320" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Role-based egress profiles</text>
  <text x="100" y="354" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24">No direct unrestricted internet</text>

  <rect x="585" y="190" width="420" height="215" rx="16" fill="#065f46" stroke="#34d399" stroke-width="2"/>
  <text x="615" y="245" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Controlled Egress Tier</text>
  <text x="615" y="286" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">DNS policy resolvers</text>
  <text x="615" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">Proxy and destination allowlists</text>
  <text x="615" y="354" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="24">Exception time-boxing</text>

  <rect x="1100" y="190" width="420" height="215" rx="16" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="1130" y="245" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Security Operations</text>
  <text x="1130" y="286" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Outbound anomaly detection</text>
  <text x="1130" y="320" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="24">C2 and exfil triage</text>
  <text x="1130" y="354" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Containment validation</text>

  <line x1="490" y1="300" x2="585" y2="300" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1005" y1="300" x2="1100" y2="300" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="70" y="470" width="1460" height="330" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="105" y="530" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600">Control Integrity Loop</text>

  <circle cx="140" cy="598" r="16" fill="#38bdf8"/>
  <text x="175" y="606" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Audit outbound rules and exception lifecycle regularly</text>

  <circle cx="140" cy="660" r="16" fill="#38bdf8"/>
  <text x="175" y="668" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Detect destination drift and unusual DNS/HTTPS behavior</text>

  <circle cx="140" cy="722" r="16" fill="#38bdf8"/>
  <text x="175" y="730" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Refine policy after incidents and exercises</text>

  <text x="980" y="598" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Security outcome:</text>
  <text x="980" y="636" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Lower attacker persistence</text>
  <text x="980" y="670" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Reduced exfiltration paths</text>
  <text x="980" y="704" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Faster targeted containment</text>
</svg>
