<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Data Lineage and Provenance Integrity</title>
  <desc id="desc">Diagram showing data flow from source through transformations, storage, sharing, and disposal with integrity checkpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f2a"/>
      <stop offset="100%" stop-color="#123b4a"/>
    </linearGradient>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#4895ef"/>
    </linearGradient>
    <linearGradient id="n2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#80ed99"/>
      <stop offset="100%" stop-color="#57cc99"/>
    </linearGradient>
    <linearGradient id="n3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="n4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f28482"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d9eeff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="94" fill="#e9f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">CISSP #83: Data Lineage and Provenance Integrity</text>
  <text x="80" y="146" fill="#cde7f4" font-family="Segoe UI, Arial, sans-serif" font-size="30">Asset security depends on knowing where data came from, where it moved, and what changed</text>

  <rect x="120" y="280" width="280" height="130" rx="14" fill="url(#n1)"/>
  <text x="158" y="335" fill="#06293a" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Source</text>
  <text x="158" y="372" fill="#06293a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Collection + Owner</text>

  <rect x="470" y="280" width="280" height="130" rx="14" fill="url(#n2)"/>
  <text x="508" y="335" fill="#08351f" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Transform</text>
  <text x="508" y="372" fill="#08351f" font-family="Segoe UI, Arial, sans-serif" font-size="24">Mask, enrich, classify</text>

  <rect x="820" y="280" width="280" height="130" rx="14" fill="url(#n3)"/>
  <text x="858" y="335" fill="#3f2a03" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Store and Share</text>
  <text x="858" y="372" fill="#3f2a03" font-family="Segoe UI, Arial, sans-serif" font-size="24">Access + transfer log</text>

  <rect x="1170" y="280" width="280" height="130" rx="14" fill="url(#n4)"/>
  <text x="1208" y="335" fill="#4a1210" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Retain or Dispose</text>
  <text x="1208" y="372" fill="#4a1210" font-family="Segoe UI, Arial, sans-serif" font-size="24">Evidence + sanitization</text>

  <line x1="400" y1="345" x2="470" y2="345" stroke="#d9eeff" stroke-width="5" marker-end="url(#arr)"/>
  <line x1="750" y1="345" x2="820" y2="345" stroke="#d9eeff" stroke-width="5" marker-end="url(#arr)"/>
  <line x1="1100" y1="345" x2="1170" y2="345" stroke="#d9eeff" stroke-width="5" marker-end="url(#arr)"/>

  <rect x="120" y="520" width="1330" height="220" rx="16" fill="#102c3a" stroke="#7fb3d5" stroke-width="2"/>
  <text x="160" y="580" fill="#e8f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Integrity Checkpoints</text>
  <text x="160" y="628" fill="#c5deed" font-family="Segoe UI, Arial, sans-serif" font-size="27">1. Provenance metadata attached at ingest</text>
  <text x="160" y="668" fill="#c5deed" font-family="Segoe UI, Arial, sans-serif" font-size="27">2. Transformation logs tied to accountable owner</text>
  <text x="160" y="708" fill="#c5deed" font-family="Segoe UI, Arial, sans-serif" font-size="27">3. Access and transfer events mapped to classification</text>
</svg>
