<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Lineage Trust Boundaries</title>
  <desc id="desc">Diagram showing internal and external data movement trust boundaries with required control checks.</desc>
  <rect width="1400" height="840" fill="#f8fbff"/>
  <text x="60" y="78" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Data Lineage Trust Boundaries</text>

  <rect x="80" y="140" width="560" height="560" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="110" y="192" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Internal Control Zone</text>

  <rect x="120" y="230" width="220" height="90" rx="10" fill="#bfdbfe"/>
  <text x="145" y="285" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Source Systems</text>

  <rect x="380" y="230" width="220" height="90" rx="10" fill="#bfdbfe"/>
  <text x="412" y="285" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="24">ETL / Pipelines</text>

  <rect x="120" y="360" width="220" height="90" rx="10" fill="#bfdbfe"/>
  <text x="160" y="415" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Data Lake</text>

  <rect x="380" y="360" width="220" height="90" rx="10" fill="#bfdbfe"/>
  <text x="405" y="415" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Analytics Apps</text>

  <rect x="760" y="140" width="560" height="560" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="790" y="192" fill="#7f1d1d" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">External / Shared Zone</text>

  <rect x="800" y="230" width="220" height="90" rx="10" fill="#fecaca"/>
  <text x="852" y="285" fill="#7f1d1d" font-family="Segoe UI, Arial, sans-serif" font-size="24">Vendors</text>

  <rect x="1060" y="230" width="220" height="90" rx="10" fill="#fecaca"/>
  <text x="1088" y="285" fill="#7f1d1d" font-family="Segoe UI, Arial, sans-serif" font-size="24">Partners</text>

  <rect x="800" y="360" width="220" height="90" rx="10" fill="#fecaca"/>
  <text x="830" y="415" fill="#7f1d1d" font-family="Segoe UI, Arial, sans-serif" font-size="24">SaaS Platforms</text>

  <rect x="1060" y="360" width="220" height="90" rx="10" fill="#fecaca"/>
  <text x="1088" y="415" fill="#7f1d1d" font-family="Segoe UI, Arial, sans-serif" font-size="24">Regulators</text>

  <line x1="640" y1="405" x2="760" y2="405" stroke="#111827" stroke-width="6" stroke-dasharray="12 8"/>
  <text x="665" y="380" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Trust Boundary</text>

  <text x="90" y="760" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="24">Required controls at boundary: classification checks, transfer authorization, provenance tags, integrity verification.</text>
</svg>
