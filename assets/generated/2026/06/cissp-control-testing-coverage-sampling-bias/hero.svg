<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Control Testing Coverage and Sampling Bias</title>
  <desc id="d">Diagram showing green dashboard metrics contrasted with blind spots caused by poor sampling coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57cc99"/>
      <stop offset="100%" stop-color="#80ed99"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f28482"/>
      <stop offset="100%" stop-color="#f94144"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="92" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">CISSP #82: Control Testing Coverage and Sampling Bias</text>
  <text x="80" y="142" fill="#c9d6ea" font-family="Segoe UI, Arial, sans-serif" font-size="29">When dashboards are green but high-risk paths were never tested</text>

  <rect x="90" y="210" width="650" height="560" rx="16" fill="#13203a" stroke="#6fa8dc" stroke-width="2"/>
  <text x="130" y="268" fill="#dcecff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Reported Control Health</text>

  <rect x="130" y="310" width="560" height="74" rx="10" fill="url(#good)"/>
  <text x="160" y="358" fill="#09351f" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">92% Test Pass Rate</text>
  <rect x="130" y="410" width="560" height="74" rx="10" fill="url(#good)"/>
  <text x="160" y="458" fill="#09351f" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">On-Time Testing: 96%</text>
  <rect x="130" y="510" width="560" height="74" rx="10" fill="url(#good)"/>
  <text x="160" y="558" fill="#09351f" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Exception Closure: 90%</text>

  <rect x="860" y="210" width="650" height="560" rx="16" fill="#3a1420" stroke="#f4978e" stroke-width="2"/>
  <text x="900" y="268" fill="#ffe3e0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Coverage Blind Spots</text>

  <rect x="900" y="310" width="560" height="74" rx="10" fill="url(#risk)"/>
  <text x="930" y="358" fill="#3f0a0c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Privileged Admin Paths Untested</text>
  <rect x="900" y="410" width="560" height="74" rx="10" fill="url(#risk)"/>
  <text x="930" y="458" fill="#3f0a0c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">After-Hours Scenarios Excluded</text>
  <rect x="900" y="510" width="560" height="74" rx="10" fill="url(#risk)"/>
  <text x="930" y="558" fill="#3f0a0c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Third-Party Exceptions Ignored</text>

  <text x="80" y="842" fill="#cfe0ff" font-family="Segoe UI, Arial, sans-serif" font-size="27">Effective assurance measures what matters, not only what is easy to test.</text>
</svg>
